syntax = "proto3";

package meshtastic;

option cc_enable_arenas = true;

message DetectionSensor {
    enum Type {
        UNKNOWN = 0;
        MOTION = 1;
        DOOR = 2;
        WINDOW = 3;
        LIGHT = 4;
        SOUND = 5;
        VIBRATION = 6;
        WATER = 7;
        SMOKE = 8;
        CO = 9;
        CO2 = 10;
    }

    Type type = 1;
    uint32 node_id = 2;
    double value = 3;
    bool triggered = 4;
    uint32 timestamp = 5;
}