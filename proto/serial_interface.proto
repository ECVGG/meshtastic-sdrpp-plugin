syntax = "proto3";

package meshtastic;

option cc_enable_arenas = true;

message SerialInterface {
    message Request {
        enum Type {
            GET_CONFIG = 0;
            SET_CONFIG = 1;
            GET_NODE_INFO = 2;
            SEND_TEXT = 3;
            GET_CHANNELS = 4;
            SET_CHANNEL = 5;
            REBOOT = 6;
        }
        Type type = 1;
        bytes payload = 2;
    }

    message Response {
        enum Status {
            OK = 0;
            ERROR = 1;
            NOT_FOUND = 2;
            INVALID = 3;
        }
        Status status = 1;
        bytes payload = 2;
    }
}