syntax = "proto3";

package meshtastic;

option cc_enable_arenas = true;

// Mesh packet structure (from meshtastic-protobufs)
message MeshPacket {
  // The payload of the packet (encrypted if channel is encrypted)
  bytes payload = 1;

  // The node ID of the sender
  uint32 from = 2;

  // The node ID of the intended recipient (0 = broadcast)
  uint32 to = 3;

  // Unique ID for this packet (used for deduplication)
  uint32 id = 4;

  // Hop limit (decremented at each hop)
  uint32 hop_limit = 5;

  // Hop start (original hop limit)
  uint32 hop_start = 6;

  // Time since boot (ms) when packet was sent
  uint32 rx_time = 7;

  // Time since boot (ms) when packet was relayed (if relayed)
  uint32 rx_time_relayed = 8;

  // SNR in dB * 4 (for quarter dB resolution)
  int32 rx_snr = 9;

  // RSSI in dBm
  int32 rx_rssi = 10;

  // True if this packet was relayed
  bool relayed = 11;

  // True if this packet was received via MQTT
  bool via_mqtt = 12;

  // True if this packet was sent by this node
  bool want_ack = 13;

  // Priority level for this packet
  uint32 priority = 14;

  // The port number (application)
  uint32 portnum = 15;

  // True if this packet was compressed
  bool compressed = 16;

  // True if this packet was encrypted
  bool encrypted = 17;

  // The channel index this packet was sent on
  uint32 channel = 18;

  // Next hop node ID (for routing)
  uint32 next_hop = 19;

  // Public key of sender (for key exchange)
  bytes public_key = 20;

  // True if this is a response to a position request
  bool want_response = 21;

  // True if this packet is a fragment
  bool is_fragment = 22;

  // Fragment index
  uint32 fragment_index = 23;

  // Total fragments
  uint32 fragment_total = 24;

  // Fragment ID for reassembly
  uint32 fragment_id = 25;
}

// Port numbers for different applications
enum PortNum {
  UNKNOWN_APP = 0;
  TEXT_MESSAGE_APP = 1;
  REMOTE_HARDWARE_APP = 2;
  POSITION_APP = 3;
  NODEINFO_APP = 4;
  ROUTING_APP = 5;
  ADMIN_APP = 6;
  TEXT_MESSAGE_APP_OLD = 7;
  WAYPOINT_APP = 8;
  AUDIO_APP = 9;
  DETECTION_SENSOR_APP = 10;
  REPLY_APP = 11;
  IP_TUNNEL_APP = 12;
  PAXCOUNTER_APP = 13;
  SERIAL_APP = 14;
  STORE_FORWARD_APP = 15;
  TRACEROUTE_APP = 16;
  NEIGHBORINFO_APP = 17;
  PRIVATE_APP = 64;  // Start of private app range
}

// Data payload for text messages
message Data {
  // The text of the message
  string text = 1;

  // The port number this data is for
  PortNum portnum = 2;

  // Optional: binary payload
  bytes payload = 3;

  // Optional: reply ID for request/response
  uint32 reply_id = 4;

  // Optional: emoji reaction
  string emoji = 5;

  // Optional: channel index
  uint32 channel = 6;
}

// Position payload
message Position {
  double latitude = 1;
  double longitude = 2;
  int32 altitude = 3;
  int32 time = 4;
  int32 location_source = 5;
  int32 gps_accuracy = 6;
  int32 battery_level = 7;
  int32 voltage = 8;
  int32 pdoa = 9;
  int32 channel = 10;
  bool altitude_hae = 11;
}

// NodeInfo payload
message User {
  string id = 1;           // User ID (e.g., "!12345678")
  string long_name = 2;    // Long name (e.g., "John Doe")
  string short_name = 3;   // Short name (e.g., "JD")
  string macaddr = 4;      // MAC address
  string hw_model = 5;     // Hardware model
  string public_key = 6;   // Public key (base64)
  string role = 7;         // Role (e.g., "CLIENT", "ROUTER")
  bool is_licensed = 8;    // Is licensed (for ham radio)
  string email = 9;        // Email
  string phone = 10;       // Phone
}

// Channel settings
message Channel {
  int32 index = 1;
  string name = 2;
  string psk = 3;           // Pre-shared key (base64)
  bool enabled = 4;
  bool uplink_enabled = 5;
  bool downlink_enabled = 6;
  int32 role = 7;
  int32 flags = 8;
  int32 slot = 9;
  string module = 10;
}

// Module config for LoRa settings
message ModuleConfig {
  int32 lora_region = 1;    // Region code
  int32 lora_modem_preset = 2; // Modem preset
  int32 lora_tx_power = 3;  // TX power in dBm
  bool lora_ignore_mqtt = 4;
  bool lora_squelch_enabled = 5;
  int32 lora_squelch_level = 6;
}

// Configuration for the device
message Config {
  ModuleConfig module_config = 1;
  repeated Channel channels = 2;
  string owner = 3;
  string owner_short = 4;
  string device_metadata = 5;
  bool is_licensed = 6;
  int32 tx_power = 7;
  int32 max_hops = 8;
  bool gps_enabled = 9;
  int32 fixed_position = 10;
  int32 position_broadcast_secs = 11;
  int32 position_broadcast_smart_enabled = 12;
  int32 screen_on_secs = 13;
  int32 lora_tx_power = 14;
  int32 lora_region = 15;
  int32 lora_modem_preset = 16;
}

// Admin message for remote config
message AdminMessage {
  string text = 1;
  Config config = 2;
  int32 command = 3;
  string target = 4;
}

// Routing message
message RouteDiscovery {
  uint32 route_to = 1;
  uint32 route_from = 2;
  repeated uint32 route = 3;
  int32 snr = 4;
  int32 hop_count = 5;
}

// Traceroute
message Traceroute {
  repeated uint32 route = 1;
  int32 snr = 2;
  int32 hop_count = 3;
}

// Neighbor info
message NeighborInfo {
  repeated Neighbor neighbors = 1;
}

message Neighbor {
  uint32 node_id = 1;
  int32 snr = 2;
  int32 last_heard = 3;
}

// Paxcounter
message Paxcount {
  int32 count = 1;
  int32 channel = 2;
}