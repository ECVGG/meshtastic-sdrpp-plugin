syntax = "proto3";

package meshtastic;

option cc_enable_arenas = true;

message DeviceUI {
    enum Action {
        NONE = 0;
        SHOW_TEXT = 1;
        SHOW_POSITION = 2;
        SHOW_NODE_INFO = 3;
        SHOW_CHANNELS = 4;
        CLEAR = 5;
    }

    Action action = 1;
    string text = 2;
    uint32 duration_ms = 3;
}