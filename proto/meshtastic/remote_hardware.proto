syntax = "proto3";

package meshtastic;

option cc_enable_arenas = true;

message RemoteHardware {
    enum Command {
        REBOOT = 0;
        GET_GPS = 1;
        GET_CONFIG = 2;
        SET_CONFIG = 3;
        SEND_TEXT = 4;
        GET_NODE_INFO = 5;
        GET_CHANNEL_INFO = 6;
        SET_CHANNEL_INFO = 7;
        GET_PREFERRED_CHANNEL = 8;
        SET_PREFERRED_CHANNEL = 9;
    }

    Command command = 1;
    bytes payload = 2;
    uint32 target = 3;
    uint32 request_id = 4;
}