syntax = "proto3";

package meshtastic;

option cc_enable_arenas = true;

message Telemetry {
    message DeviceMetrics {
        double battery_level = 1;
        double voltage = 2;
        double channel_utilization = 3;
        double air_util_tx = 4;
        int32 uptime_seconds = 5;
    }

    message EnvironmentMetrics {
        double temperature = 1;
        double relative_humidity = 2;
        double barometric_pressure = 3;
        double gas_resistance = 4;
        double iaq = 5;
    }

    message PowerMetrics {
        double ch0_voltage = 1;
        double ch1_voltage = 2;
        double ch2_voltage = 3;
        double ch3_voltage = 4;
        double ch0_current = 5;
        double ch1_current = 6;
        double ch2_current = 7;
        double ch3_current = 8;
    }

    message AirQualityMetrics {
        double pm10_standard = 1;
        double pm25_standard = 2;
        double pm100_standard = 3;
        double pm10_env = 4;
        double pm25_env = 5;
        double pm100_env = 6;
        double pm10_standard_count = 7;
        double pm25_standard_count = 8;
        double pm100_standard_count = 9;
        double pm10_env_count = 10;
        double pm25_env_count = 11;
        double pm100_env_count = 12;
    }

    message LocalStats {
        uint32 num_packets_rx = 1;
        uint32 num_packets_tx = 2;
        uint32 num_packets_rx_dropped = 3;
        uint32 num_packets_tx_dropped = 4;
        uint32 num_online_nodes = 5;
        uint32 num_total_nodes = 6;
        uint32 num_nbr_nodes = 7;
        uint32 num_nbr_nodes_no_heard = 8;
    }

    oneof variant {
        DeviceMetrics device_metrics = 1;
        EnvironmentMetrics environment_metrics = 2;
        PowerMetrics power_metrics = 3;
        AirQualityMetrics air_quality_metrics = 4;
        LocalStats local_stats = 5;
    }
}