syntax = "proto3";

package meshtastic;

option cc_enable_arenas = true;

message RemoteLogging {
    enum Level {
        DEBUG = 0;
        INFO = 1;
        WARNING = 2;
        ERROR = 3;
        CRITICAL = 4;
    }

    Level level = 1;
    string message = 2;
    uint32 timestamp = 3;
    string module = 4;
}