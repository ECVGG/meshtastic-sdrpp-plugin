name: CI Minimal Two Jobs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  setup-vcpkg:
    name: Setup vcpkg
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Test step
        shell: pwsh
        run: Write-Host "Setup vcpkg done"

  build_windows:
    name: Build Windows (MSVC, ${{ matrix.build_type }})
    needs: setup-vcpkg
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Test build
        shell: pwsh
        run: Write-Host "Build ${{ matrix.build_type }} done"