name: CI/CD - Windows Only

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  VCPKG_VERSION: "2024.10.15"

jobs:
  setup-vcpkg:
    name: Setup vcpkg & Install Dependencies
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            C:/vcpkg/downloads
            C:/vcpkg/binarycache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        id: setup-vcpkg
        shell: pwsh
        timeout-minutes: 10
        run: |
          if (-not (Test-Path "C:/vcpkg")) {
            Write-Host "vcpkg not found, installing..."
            git clone --depth 1 --branch ${{ env.VCPKG_VERSION }} https://github.com/microsoft/vcpkg.git C:/vcpkg
            cd C:/vcpkg
            ./bootstrap-vcpkg.bat -disableMetrics
          } else {
            Write-Host "Using pre-installed vcpkg at C:/vcpkg"
            cd C:/vcpkg
            git fetch --depth 1 origin ${{ env.VCPKG_VERSION }} 2>$null || $true
            git checkout ${{ env.VCPKG_VERSION }} 2>$null || $true
            ./bootstrap-vcpkg.bat -disableMetrics 2>$null || $true
          }
          $binaryCacheDir = "C:/vcpkg/binarycache"
          New-Item -ItemType Directory -Force -Path $binaryCacheDir | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$binaryCacheDir,readwrite"
          $env:VCPKG_FEATURE_FLAGS = "manifests,binarycaching"
          echo "VCPKG_ROOT=C:/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install vcpkg dependencies
        shell: pwsh
        timeout-minutes: 25
        run: |
          cd C:/vcpkg
          ./vcpkg install --triplet x64-windows `
            --x-manifest-root="${{ github.workspace }}" `
            --x-wait-for-lock `
            --feature-flags=manifests,binarycaching `
            --binarysource="clear;files,C:/vcpkg/binarycache,readwrite"
          ./vcpkg list --triplet x64-windows

  build_windows:
    name: Build Windows (MSVC, ${{ matrix.build_type }})
    needs: setup-vcpkg
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            C:/vcpkg/downloads
            C:/vcpkg/binarycache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg (Windows)
        shell: pwsh
        timeout-minutes: 5
        run: |
          if (-not (Test-Path "C:/vcpkg")) {
            Write-Host "vcpkg not found, installing..."
            git clone --depth 1 --branch ${{ env.VCPKG_VERSION }} https://github.com/microsoft/vcpkg.git C:/vcpkg
            cd C:/vcpkg
            ./bootstrap-vcpkg.bat -disableMetrics
          } else {
            Write-Host "Using cached vcpkg at C:/vcpkg"
            cd C:/vcpkg
            git checkout ${{ env.VCPKG_VERSION }} 2>$null || $true
            ./bootstrap-vcpkg.bat -disableMetrics 2>$null || $true
          }
          $binaryCacheDir = "C:/vcpkg/binarycache"
          New-Item -ItemType Directory -Force -Path $binaryCacheDir | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$binaryCacheDir,readwrite"
          $env:VCPKG_FEATURE_FLAGS = "manifests,binarycaching"
          echo "VCPKG_ROOT=C:/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build test
        shell: pwsh
        run: |
          Write-Host "Build test successful"