name: Build Meshtastic Plugin

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  VCPKG_VERSION: "2024.06.14"
  SDRPP_REPO: "https://github.com/AlexandreRouma/SDRPlusPlus.git"
  SDRPP_COMMIT: "master"

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            C:/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-
            vcpkg-${{ runner.os }}-

      - name: Cache SDR++ source
        id: sdrpp-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/sdrpp-src
          key: sdrpp-src-${{ runner.os }}-${{ env.SDRPP_COMMIT }}
          restore-keys: |
            sdrpp-src-${{ runner.os }}-

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "C:/vcpkg")) {
            git clone --depth 1 --branch ${{ env.VCPKG_VERSION }} https://github.com/microsoft/vcpkg.git C:/vcpkg
            cd C:/vcpkg; ./bootstrap-vcpkg.bat -disableMetrics
          } else {
            cd C:/vcpkg
            git checkout ${{ env.VCPKG_VERSION }} 2>$null || $true
            ./bootstrap-vcpkg.bat -disableMetrics 2>$null || $true
          }
          $env:VCPKG_BINARY_SOURCES = "clear;x-gha,readwrite;files,C:/vcpkg/downloads,readwrite"
          $env:VCPKG_FEATURE_FLAGS = "binarycaching,manifests"
          echo "VCPKG_ROOT=C:/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_TOOLCHAIN_PATH=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cd C:/vcpkg
          $packages = @("protobuf", "cryptopp", "abseil", "fmt", "spdlog", "nlohmann-json", "gtest")
          ./vcpkg install $packages --triplet x64-windows
          Write-Host "=== Installed packages ==="
          ./vcpkg list --triplet x64-windows

          Write-Host "=== Finding ProtobufConfig.cmake ==="
          $protobufConfigs = Get-ChildItem "C:/vcpkg/installed/x64-windows" -Recurse -Filter "ProtobufConfig.cmake" -ErrorAction SilentlyContinue
          if ($protobufConfigs) {
            $protobufDir = $protobufConfigs[0].DirectoryName
            Write-Host "Found ProtobufConfig.cmake at: $protobufDir"
            echo "PROTOBUF_CONFIG_DIR=$protobufDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "WARNING: ProtobufConfig.cmake not found!"
          }

      - name: Verify cached dependencies
        if: steps.vcpkg-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          Write-Host "=== Verifying cached packages ==="
          ./vcpkg list --triplet x64-windows

          Write-Host "=== Finding ProtobufConfig.cmake ==="
          $protobufConfigs = Get-ChildItem "C:/vcpkg/installed/x64-windows" -Recurse -Filter "ProtobufConfig.cmake" -ErrorAction SilentlyContinue
          if ($protobufConfigs) {
            $protobufDir = $protobufConfigs[0].DirectoryName
            Write-Host "Found ProtobufConfig.cmake at: $protobufDir"
            echo "PROTOBUF_CONFIG_DIR=$protobufDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "WARNING: ProtobufConfig.cmake not found in cache, reinstalling..."
            $packages = @("protobuf", "cryptopp", "abseil", "fmt", "spdlog", "nlohmann-json", "gtest")
            ./vcpkg install $packages --triplet x64-windows

            $protobufConfigs = Get-ChildItem "C:/vcpkg/installed/x64-windows" -Recurse -Filter "ProtobufConfig.cmake" -ErrorAction SilentlyContinue
            if ($protobufConfigs) {
              $protobufDir = $protobufConfigs[0].DirectoryName
              Write-Host "Found ProtobufConfig.cmake at: $protobufDir"
              echo "PROTOBUF_CONFIG_DIR=$protobufDir" | Out-File -FilePath $env:GITHUB_ENV -Append
            } else {
              Write-Host "ERROR: ProtobufConfig.cmake still not found after reinstall!"
              exit 1
            }
          }

      - name: Fetch SDR++ source (shallow, cached)
        if: steps.sdrpp-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:/sdrpp-src")) {
            git clone --depth 1 --branch ${{ env.SDRPP_COMMIT }} ${{ env.SDRPP_REPO }} C:/sdrpp-src
          } else {
            cd C:/sdrpp-src
            git fetch --depth 1 origin ${{ env.SDRPP_COMMIT }}
            git checkout FETCH_HEAD
          }
          Write-Host "SDR++ source fetched at C:/sdrpp-src"

      - name: Create SDR++ CMake config (hardcoded paths - simple & fast)
        id: sdrpp-config
        shell: pwsh
        run: |
          $srcRoot = "C:/sdrpp-src"

          # Known SDR++ include directories (from repo structure)
          $includeDirs = @(
            Join-Path $srcRoot "core/src"
            Join-Path $srcRoot "src"
            Join-Path $srcRoot "core/src/gui"
            Join-Path $srcRoot "core/src/dsp"
            Join-Path $srcRoot "src/gui"
            Join-Path $srcRoot "third-party/imgui"
            Join-Path $srcRoot "core/third-party/imgui"
            Join-Path $srcRoot "core/src/gui/widgets"
            Join-Path $srcRoot "src/gui/widgets"
          )

          # Verify headers exist
          foreach ($dir in $includeDirs) {
            Write-Host "Checking $dir..."
            Get-ChildItem $dir -Recurse -Filter "*.h" -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { Write-Host "  $_" }
          }

          $includeDirsForward = $includeDirs | ForEach-Object { $_.Replace('\', '/') }
          $srcRootForward = $srcRoot.Replace('\', '/')

          $cmakeDir = "C:/sdrpp-cmake/SDRPlusPlus"
          if (-not (Test-Path $cmakeDir)) {
            New-Item -ItemType Directory -Force -Path $cmakeDir | Out-Null
          }

          $configFile = Join-Path $cmakeDir "SDRPlusPlusConfig.cmake"
          $includeDirsCmake = ($includeDirsForward | ForEach-Object { '"' + $_ + '"' }) -join ';'
          @(
            '# Minimal SDRPlusPlus config for plugin building'
            'set(SDRPlusPlus_VERSION "nightly")'
            'set(SDRPlusPlus_INCLUDE_DIRS ' + $includeDirsCmake + ')'
            'set(SDRPlusPlus_LIBRARY_DIRS "")'
            'set(SDRPlusPlus_LIBRARIES "")'
            'set(SDRPlusPlus_PLUGIN_SUFFIX ".dll")'
            'set(SDRPlusPlus_PLUGIN_INSTALL_DIR "' + $srcRootForward + '/plugins")'
          ) -join "`n" | Out-File -FilePath $configFile -Encoding UTF8

          Write-Host "Created SDRPlusPlusConfig.cmake:"
          Get-Content $configFile | ForEach-Object { Write-Host "  $_" }

          # Verify file exists
          if (-not (Test-Path $configFile)) {
            Write-Host "ERROR: Config file not created!"
            exit 1
          }

          $moduleFile = Join-Path $cmakeDir "sdrpp_module.cmake"
          @(
            '# sdrpp_module.cmake - SDR++ module/plugin build system'
            'cmake_minimum_required(VERSION 3.13)'
            ''
            'function(sdrpp_add_module MODULE_NAME)'
            '  add_library(${MODULE_NAME} MODULE ${ARGN})'
            '  set_target_properties(${MODULE_NAME} PROPERTIES'
            '    PREFIX ""'
            '    SUFFIX "${SDRPlusPlus_PLUGIN_SUFFIX}"'
            '  )'
            '  target_include_directories(${MODULE_NAME} PRIVATE ${SDRPlusPlus_INCLUDE_DIRS})'
            '  target_link_libraries(${MODULE_NAME} PRIVATE ${SDRPlusPlus_LIBRARIES})'
            '  if (SDRPlusPlus_PLUGIN_INSTALL_DIR)'
            '    install(TARGETS ${MODULE_NAME} DESTINATION ${SDRPlusPlus_PLUGIN_INSTALL_DIR})'
            '  endif()'
            'endfunction()'
            ''
            'function(sdrpp_get_module_cmake_dir OUT_VAR)'
            '  set(${OUT_VAR} ${CMAKE_CURRENT_LIST_DIR} PARENT_SCOPE)'
            'endfunction()'
          ) -join "`n" | Out-File -FilePath $moduleFile -Encoding UTF8

          Write-Host "Created sdrpp_module.cmake"

          echo "SDRPP_CMAKE_DIR=$cmakeDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdrppCmakeDir = "${{ steps.sdrpp-config.outputs.SDRPP_CMAKE_DIR }}"
          $vcpkgToolchain = "C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

          # Verify config file exists
          $configFile = Join-Path $sdrppCmakeDir "SDRPlusPlusConfig.cmake"
          if (-not (Test-Path $configFile)) {
            Write-Host "ERROR: SDRPlusPlusConfig.cmake not found at $configFile"
            exit 1
          }
          Write-Host "Config file verified: $configFile"

          # Use vcpkg toolchain file for proper package discovery
          # Also pass Protobuf_DIR explicitly from the install step
          $protobufDir = $env:PROTOBUF_CONFIG_DIR
          if (-not $protobufDir) {
            $protobufConfigs = Get-ChildItem "C:/vcpkg/installed/x64-windows" -Recurse -Filter "ProtobufConfig.cmake" -ErrorAction SilentlyContinue
            if ($protobufConfigs) {
              $protobufDir = $protobufConfigs[0].DirectoryName
            }
          }

          $cmakeArgs = @(
            '-S', '.'
            '-B', 'build'
            '-G', 'Visual Studio 17 2022'
            '-A', 'x64'
            '-DCMAKE_BUILD_TYPE=Release'
            '-DCMAKE_TOOLCHAIN_FILE=' + $vcpkgToolchain
            '-DVCPKG_TARGET_TRIPLET=x64-windows'
            '-DSDRPP_CMAKE_DIR=' + $sdrppCmakeDir
            '-DSDRPP_MODULE_CMAKE=' + $sdrppCmakeDir + '/sdrpp_module.cmake'
            '-DSDRPlusPlus_DIR=' + $sdrppCmakeDir
          )

          if ($protobufDir) {
            $cmakeArgs += '-DProtobuf_DIR=' + $protobufDir
            Write-Host "Adding Protobuf_DIR=$protobufDir"
          }

          Write-Host "Running cmake with arguments:"
          Write-Host ($cmakeArgs -join ' ')

          & cmake @cmakeArgs
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            throw "cmake configure failed with exit code $exitCode"
          }
          Write-Host "Configure step completed successfully"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-decoder-plugin
          path: build/Release/*.dll
          retention-days: 7

      - name: Package on tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: cmake --build build --config Release --target package

      - name: Upload package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-decoder-plugin-package
          path: build/*.zip
          retention-days: 7