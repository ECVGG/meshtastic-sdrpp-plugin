name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: meshtastic-linux-x64
            plugin_suffix: ".so"
          - os: macos-latest
            artifact_name: meshtastic-macos-x64
            plugin_suffix: ".dylib"
          - os: windows-latest
            artifact_name: meshtastic-windows-x64
            plugin_suffix: ".dll"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # =========================================================================
      # LINUX: System packages + build liquid-dsp from source
      # =========================================================================
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libprotobuf-dev protobuf-compiler \
            libcrypto++-dev \
            libabsl-dev libfmt-dev libspdlog-dev nlohmann-json3-dev \
            libvolk-dev \
            pkg-config git

      - name: Build liquid-dsp from source (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          cd /tmp
          git clone --depth 1 --branch v1.3.2 https://github.com/jgaeddert/liquid-dsp.git
          cd liquid-dsp
          ./bootstrap.sh
          ./configure --prefix=/usr/local
          make -j4
          sudo make install
          sudo ldconfig

      # =========================================================================
      # MACOS: System packages only + build liquid-dsp from source
      # =========================================================================
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja protobuf cryptopp abseil fmt spdlog nlohmann-json volk pkg-config git automake autoconf libtool

      - name: Build liquid-dsp from source (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          cd /tmp
          git clone --depth 1 --branch v1.3.2 https://github.com/jgaeddert/liquid-dsp.git
          cd liquid-dsp
          ./bootstrap.sh
          ./configure --prefix=/usr/local
          make -j4
          sudo make install

      # =========================================================================
      # WINDOWS: Install vcpkg with caching and binary packages for speed
      # =========================================================================
      - name: Cache vcpkg
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:/vcpkg
          key: vcpkg-${{ hashFiles('vcpkg.json') }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vcpkg-${{ hashFiles('vcpkg.json') }}-${{ runner.os }}-

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          set -x

          echo "=== Checking vcpkg cache ==="

          # Try to restore vcpkg from cache
          if [ -d "C:/vcpkg" ]; then
            echo "vcpkg directory exists from cache, checking..."
            cd C:/vcpkg
            CURRENT_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
            echo "Cached vcpkg commit: $CURRENT_COMMIT"
          fi

          if [ ! -d "C:/vcpkg" ]; then
            echo "=== Installing vcpkg ==="
            git clone https://github.com/microsoft/vcpkg.git C:/vcpkg
            cd C:/vcpkg
            ./bootstrap-vcpkg.bat -disableMetrics
          else
            cd C:/vcpkg
          fi

          echo "=== Installing plugin dependencies via vcpkg (using manifest) ==="
          # Use $RUNNER_TEMP (set by GitHub Actions) for binary cache path
          # Convert Windows path to Unix-style for bash
          VCPKG_BINARY_CACHE="${RUNNER_TEMP//\\//}/vcpkg-binaries"
          mkdir -p "$VCPKG_BINARY_CACHE"
          # Must run from repo root where vcpkg.json is located
          cd "${GITHUB_WORKSPACE}"
          C:/vcpkg/vcpkg install \
            --triplet x64-windows \
            --binarysource=clear;files,"$VCPKG_BINARY_CACHE",readwrite \
            --x-wait-for-lock \
            --feature-flags=manifests

          echo "VCPKG_ROOT=C:/vcpkg" >> $GITHUB_ENV

      # =========================================================================
      # All platforms: Use portable SDR++ releases
      # =========================================================================
      - name: Setup SDR++ portable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          set -x

          # Use fixed URL for nightly release - Ubuntu noble (24.04) .deb package
          ASSET_URL="https://github.com/AlexandreRouma/SDRPlusPlus/releases/download/nightly/sdrpp_ubuntu_noble_amd64.deb"

          echo "=== Downloading SDR++ from: $ASSET_URL ==="
          curl -L -o sdrpp_linux.deb "$ASSET_URL"

          echo "=== Extracting .deb package ==="
          mkdir -p sdrpp_install
          dpkg -x sdrpp_linux.deb sdrpp_install

          echo "=== Finding extracted directory ==="
          find sdrpp_install -maxdepth 1 -type d
          # The .deb extracts to usr/bin, usr/lib, usr/include etc.
          # Find the actual SDR++ directory structure
          SDRPP_DIR=$(find sdrpp_install -mindepth 1 -maxdepth 1 -type d \( -name "*SDRPlusPlus*" -o -name "*sdrpp*" \) | head -1)

          if [ -z "$SDRPP_DIR" ]; then
            # .deb extracts to usr/ - use the install prefix
            SDRPP_DIR=sdrpp_install/usr
          fi

          if [ -z "$SDRPP_DIR" ]; then
            echo "ERROR: Could not find extracted SDR++ directory"
            exit 1
          fi

          # Handle both relative and absolute paths
          if [[ "$SDRPP_DIR" = /* ]]; then
            SDRPP_ROOT="$SDRPP_DIR"
          else
            SDRPP_ROOT=$(pwd)/$SDRPP_DIR
          fi
          echo "SDR++ extracted to: $SDRPP_ROOT"
          ls -la "$SDRPP_ROOT"

          echo "=== Debug: Check for include directory ==="
          ls -la "$SDRPP_ROOT/include" 2>/dev/null || echo "No include directory at SDRPP_ROOT/include"
          ls -la "$SDRPP_ROOT/Include" 2>/dev/null || echo "No Include directory at SDRPP_ROOT/Include"
          find "$SDRPP_ROOT" -name "*.h" -type f | head -5

          echo "=== Creating minimal SDRPlusPlusConfig.cmake ==="
          mkdir -p "$SDRPP_ROOT/lib/cmake/SDRPlusPlus"

          # Debug: list the portable release structure
          echo "=== Portable release structure ==="
          find "$SDRPP_ROOT" -type f -name "*.h" | head -20
          ls -la "$SDRPP_ROOT"

          # Find include directory - portable release has include/ or Include/ at root
          INCLUDE_DIR=""
          if [ -d "$SDRPP_ROOT/include" ]; then
            INCLUDE_DIR="$SDRPP_ROOT/include"
            echo "Found include at: $INCLUDE_DIR"
          elif [ -d "$SDRPP_ROOT/Include" ]; then
            INCLUDE_DIR="$SDRPP_ROOT/Include"
            echo "Found Include at: $INCLUDE_DIR"
          else
            # Fallback: search for any .h files
            INCLUDE_DIR=$(find "$SDRPP_ROOT" -name "*.h" -type f | head -1 | xargs dirname 2>/dev/null || echo "")
            if [ -n "$INCLUDE_DIR" ]; then
              echo "Found include via find: $INCLUDE_DIR"
            fi
          fi
          # Only set INCLUDE_DIR if it actually exists
          if [ -n "$INCLUDE_DIR" ] && [ ! -d "$INCLUDE_DIR" ]; then
            INCLUDE_DIR=""
          fi

          # Find lib directory - portable release has .so files at root or in lib/
          LIB_DIR=""
          if [ -d "$SDRPP_ROOT/lib" ]; then
            LIB_DIR="$SDRPP_ROOT/lib"
            echo "Found lib at: $LIB_DIR"
          elif [ -d "$SDRPP_ROOT/bin" ]; then
            LIB_DIR="$SDRPP_ROOT/bin"
            echo "Found bin at: $LIB_DIR"
          else
            # Fallback: search for .so files
            LIB_DIR=$(find "$SDRPP_ROOT" -name "*.so" | head -1 | xargs dirname 2>/dev/null || echo "")
            if [ -n "$LIB_DIR" ]; then
              echo "Found lib via find: $LIB_DIR"
            fi
          fi
          if [ -z "$LIB_DIR" ]; then
            LIB_DIR="$SDRPP_ROOT"
          fi

          echo "INCLUDE_DIR: $INCLUDE_DIR"
          echo "LIB_DIR: $LIB_DIR"

          # Write CMake config using echo (avoids heredoc/YAML issues)
          CFG="$SDRPP_ROOT/lib/cmake/SDRPlusPlus/SDRPlusPlusConfig.cmake"
          echo '# Minimal SDR++ config for plugin development' > "$CFG"
          echo '# Generated from portable release - no separate libraries, use INTERFACE target' >> "$CFG"
          echo '' >> "$CFG"
          echo 'set(SDRPlusPlus_VERSION "1.0.0")' >> "$CFG"

          if [ -n "$INCLUDE_DIR" ]; then
            # Compute relative path from config location to include dir
            REL_INCLUDE="${CMAKE_CURRENT_LIST_DIR}/../../../include"
            echo "set(SDRPlusPlus_INCLUDE_DIRS \"${REL_INCLUDE}\")" >> "$CFG"
          else
            echo "# No include directory found in portable release" >> "$CFG"
            echo "set(SDRPlusPlus_INCLUDE_DIRS \"\")" >> "$CFG"
          fi
          echo '' >> "$CFG"
          echo '# Create INTERFACE target for SDR++ core (portable release has no separate library)' >> "$CFG"
          echo 'if(NOT TARGET SDRPlusPlus::SDRPlusPlus)' >> "$CFG"
          echo '  add_library(SDRPlusPlus::SDRPlusPlus INTERFACE IMPORTED)' >> "$CFG"
          if [ -n "$INCLUDE_DIR" ]; then
            echo '  set_target_properties(SDRPlusPlus::SDRPlusPlus PROPERTIES' >> "$CFG"
            echo '    INTERFACE_INCLUDE_DIRECTORIES "${SDRPlusPlus_INCLUDE_DIRS}"' >> "$CFG"
            echo '  )' >> "$CFG"
          fi
          echo 'endif()' >> "$CFG"
          echo '' >> "$CFG"
          echo '# ImGui is typically bundled with SDR++ - try to find it' >> "$CFG"
          echo 'find_library(SDRPlusPlus_IMGUI_LIBRARY' >> "$CFG"
          echo '  NAMES imgui' >> "$CFG"
          echo '  PATHS "${CMAKE_CURRENT_LIST_DIR}/../../../" "${CMAKE_CURRENT_LIST_DIR}/../../../lib" "${CMAKE_CURRENT_LIST_DIR}/../../../bin"' >> "$CFG"
          echo '  NO_DEFAULT_PATH' >> "$CFG"
          echo ')' >> "$CFG"
          echo '' >> "$CFG"
          echo 'if(SDRPlusPlus_IMGUI_LIBRARY AND NOT TARGET SDRPlusPlus::ImGui)' >> "$CFG"
          echo '  add_library(SDRPlusPlus::ImGui SHARED IMPORTED)' >> "$CFG"
          echo '  set_target_properties(SDRPlusPlus::ImGui PROPERTIES' >> "$CFG"
          echo '    IMPORTED_LOCATION "${SDRPlusPlus_IMGUI_LIBRARY}"' >> "$CFG"
          echo '  )' >> "$CFG"
          echo 'else()' >> "$CFG"
          echo '  # Create INTERFACE target for ImGui if not found' >> "$CFG"
          echo '  if(NOT TARGET SDRPlusPlus::ImGui)' >> "$CFG"
          echo '    add_library(SDRPlusPlus::ImGui INTERFACE IMPORTED)' >> "$CFG"
          echo '  endif()' >> "$CFG"
          echo 'endif()' >> "$CFG"
          echo '' >> "$CFG"
          echo '# Provide compatibility variables' >> "$CFG"
          echo 'set(SDRPlusPlus_LIBRARIES SDRPlusPlus::SDRPlusPlus)' >> "$CFG"
          echo 'set(SDRPlusPlus_DEFINITIONS "")' >> "$CFG"
          echo '' >> "$CFG"
          echo '# Module install directory' >> "$CFG"
          echo 'set(SDRPlusPlus_PLUGIN_INSTALL_DIR "modules" CACHE PATH "SDR++ plugin install directory")' >> "$CFG"
          echo '' >> "$CFG"
          echo 'message(STATUS "Found SDR++ (portable): ${SDRPlusPlus_VERSION}")' >> "$CFG"
          echo 'message(STATUS "SDR++ include dirs: ${SDRPlusPlus_INCLUDE_DIRS}")' >> "$CFG"

          echo "=== Created SDRPlusPlusConfig.cmake ==="
          cat "$SDRPP_ROOT/lib/cmake/SDRPlusPlus/SDRPlusPlusConfig.cmake"

          echo "SDRPP_CORE_ROOT=$SDRPP_ROOT" >> $GITHUB_ENV

      # =========================================================================
      # MACOS: Use portable SDR++ release + generate minimal CMake config
      # =========================================================================
      - name: Setup SDR++ portable (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          set -x

          # Use fixed URL for nightly release - macOS Intel (x64) zip
          ASSET_URL="https://github.com/AlexandreRouma/SDRPlusPlus/releases/download/nightly/sdrpp_macos_intel.zip"

          echo "=== Downloading SDR++ from: $ASSET_URL ==="
          curl -L -o sdrpp_macos.zip "$ASSET_URL"

          echo "=== Extracting ==="
          unzip -q sdrpp_macos.zip -d sdrpp_install

          echo "=== Finding extracted directory ==="
          find sdrpp_install -maxdepth 1 -type d
          # First, try to find the actual SDR++ subdirectory (exclude parent sdrpp_install)
          SDRPP_DIR=$(find sdrpp_install -mindepth 1 -maxdepth 1 -type d \( -name "*SDRPlusPlus*" -o -name "*sdrpp*" \) | head -1)

          if [ -z "$SDRPP_DIR" ]; then
            # Fallback: any subdirectory of sdrpp_install that's not the parent itself
            SDRPP_DIR=$(find sdrpp_install -mindepth 1 -maxdepth 1 -type d | head -1)
          fi

          if [ -z "$SDRPP_DIR" ]; then
            echo "ERROR: Could not find extracted SDR++ directory"
            exit 1
          fi

          SDRPP_ROOT=$(pwd)/$SDRPP_DIR
          echo "SDR++ extracted to: $SDRPP_ROOT"
          ls -la "$SDRPP_ROOT"

          echo "=== Debug: Check .app bundle structure ==="
          find "$SDRPP_ROOT" -name "*.h" -type f | head -10
          find "$SDRPP_ROOT" -path "*/Headers" -type d | head -5
          find "$SDRPP_ROOT" -path "*/Frameworks/*" -name "*.dylib" | head -5

          echo "=== Creating minimal SDRPlusPlusConfig.cmake ==="
          mkdir -p "$SDRPP_ROOT/lib/cmake/SDRPlusPlus"

          # Debug: list the portable release structure
          echo "=== Portable release structure ==="
          find "$SDRPP_ROOT" -type f -name "*.h" | head -20
          ls -la "$SDRPP_ROOT"

          # Find include directory - macOS .app bundle has headers in Contents/Frameworks/*.framework/Headers
          INCLUDE_DIR=""
          if [ -d "$SDRPP_ROOT/include" ]; then
            INCLUDE_DIR="$SDRPP_ROOT/include"
            echo "Found include at: $INCLUDE_DIR"
          elif [ -d "$SDRPP_ROOT/Include" ]; then
            INCLUDE_DIR="$SDRPP_ROOT/Include"
            echo "Found Include at: $INCLUDE_DIR"
          else
            # macOS .app bundle: search for framework headers
            INCLUDE_DIR=$(find "$SDRPP_ROOT" -path "*/Frameworks/*" -name "*.h" -type f | head -1 | xargs dirname 2>/dev/null || echo "")
            if [ -n "$INCLUDE_DIR" ]; then
              echo "Found include via Frameworks find: $INCLUDE_DIR"
            fi
            # Also check for .framework/Headers
            if [ -z "$INCLUDE_DIR" ] || [ ! -d "$INCLUDE_DIR" ]; then
              INCLUDE_DIR=$(find "$SDRPP_ROOT" -path "*/Headers" -type d | head -1 2>/dev/null || echo "")
              if [ -n "$INCLUDE_DIR" ]; then
                echo "Found include via Headers find: $INCLUDE_DIR"
              fi
            fi
          fi
          # Only set INCLUDE_DIR if it actually exists
          if [ -n "$INCLUDE_DIR" ] && [ ! -d "$INCLUDE_DIR" ]; then
            INCLUDE_DIR=""
          fi

          # Find lib directory - macOS .app bundle has libraries in Contents/Frameworks/*.framework
          LIB_DIR=""
          if [ -d "$SDRPP_ROOT/lib" ]; then
            LIB_DIR="$SDRPP_ROOT/lib"
            echo "Found lib at: $LIB_DIR"
          elif [ -d "$SDRPP_ROOT/bin" ]; then
            LIB_DIR="$SDRPP_ROOT/bin"
            echo "Found bin at: $LIB_DIR"
          else
            # macOS .app bundle: search for .dylib or .framework
            LIB_DIR=$(find "$SDRPP_ROOT" -path "*/Frameworks/*" -name "*.dylib" -o -path "*/Frameworks/*.framework" | head -1 | xargs dirname 2>/dev/null || echo "")
            if [ -n "$LIB_DIR" ]; then
              echo "Found lib via Frameworks find: $LIB_DIR"
            fi
          fi
          if [ -z "$LIB_DIR" ]; then
            LIB_DIR="$SDRPP_ROOT"
          fi

          echo "INCLUDE_DIR: $INCLUDE_DIR"
          echo "LIB_DIR: $LIB_DIR"

          # Write CMake config using echo (avoids heredoc/YAML issues)
          CFG="$SDRPP_ROOT/lib/cmake/SDRPlusPlus/SDRPlusPlusConfig.cmake"
          echo '# Minimal SDR++ config for plugin development' > "$CFG"
          echo '# Generated from portable release - no separate libraries, use INTERFACE target' >> "$CFG"
          echo '' >> "$CFG"
          echo 'set(SDRPlusPlus_VERSION "1.0.0")' >> "$CFG"

          if [ -n "$INCLUDE_DIR" ]; then
            # Compute relative path from config location to include dir
            REL_INCLUDE="${CMAKE_CURRENT_LIST_DIR}/../../../include"
            echo "set(SDRPlusPlus_INCLUDE_DIRS \"${REL_INCLUDE}\")" >> "$CFG"
          else
            echo "# No include directory found in portable release" >> "$CFG"
            echo "set(SDRPlusPlus_INCLUDE_DIRS \"\")" >> "$CFG"
          fi
          echo '' >> "$CFG"
          echo '# Create INTERFACE target for SDR++ core (portable release has no separate library)' >> "$CFG"
          echo 'if(NOT TARGET SDRPlusPlus::SDRPlusPlus)' >> "$CFG"
          echo '  add_library(SDRPlusPlus::SDRPlusPlus INTERFACE IMPORTED)' >> "$CFG"
          if [ -n "$INCLUDE_DIR" ]; then
            echo '  set_target_properties(SDRPlusPlus::SDRPlusPlus PROPERTIES' >> "$CFG"
            echo '    INTERFACE_INCLUDE_DIRECTORIES "${SDRPlusPlus_INCLUDE_DIRS}"' >> "$CFG"
            echo '  )' >> "$CFG"
          fi
          echo 'endif()' >> "$CFG"
          echo '' >> "$CFG"
          echo '# ImGui is typically bundled with SDR++ - try to find it' >> "$CFG"
          echo 'find_library(SDRPlusPlus_IMGUI_LIBRARY' >> "$CFG"
          echo '  NAMES imgui' >> "$CFG"
          echo '  PATHS "${CMAKE_CURRENT_LIST_DIR}/../../../" "${CMAKE_CURRENT_LIST_DIR}/../../../lib" "${CMAKE_CURRENT_LIST_DIR}/../../../bin"' >> "$CFG"
          echo '  NO_DEFAULT_PATH' >> "$CFG"
          echo ')' >> "$CFG"
          echo '' >> "$CFG"
          echo 'if(SDRPlusPlus_IMGUI_LIBRARY AND NOT TARGET SDRPlusPlus::ImGui)' >> "$CFG"
          echo '  add_library(SDRPlusPlus::ImGui SHARED IMPORTED)' >> "$CFG"
          echo '  set_target_properties(SDRPlusPlus::ImGui PROPERTIES' >> "$CFG"
          echo '    IMPORTED_LOCATION "${SDRPlusPlus_IMGUI_LIBRARY}"' >> "$CFG"
          echo '  )' >> "$CFG"
          echo 'else()' >> "$CFG"
          echo '  # Create INTERFACE target for ImGui if not found' >> "$CFG"
          echo '  if(NOT TARGET SDRPlusPlus::ImGui)' >> "$CFG"
          echo '    add_library(SDRPlusPlus::ImGui INTERFACE IMPORTED)' >> "$CFG"
          echo '  endif()' >> "$CFG"
          echo 'endif()' >> "$CFG"
          echo '' >> "$CFG"
          echo '# Provide compatibility variables' >> "$CFG"
          echo 'set(SDRPlusPlus_LIBRARIES SDRPlusPlus::SDRPlusPlus)' >> "$CFG"
          echo 'set(SDRPlusPlus_DEFINITIONS "")' >> "$CFG"
          echo '' >> "$CFG"
          echo '# Module install directory' >> "$CFG"
          echo 'set(SDRPlusPlus_PLUGIN_INSTALL_DIR "modules" CACHE PATH "SDR++ plugin install directory")' >> "$CFG"
          echo '' >> "$CFG"
          echo 'message(STATUS "Found SDR++ (portable): ${SDRPlusPlus_VERSION}")' >> "$CFG"
          echo 'message(STATUS "SDR++ include dirs: ${SDRPlusPlus_INCLUDE_DIRS}")' >> "$CFG"

          echo "=== Created SDRPlusPlusConfig.cmake ==="
          cat "$SDRPP_ROOT/lib/cmake/SDRPlusPlus/SDRPlusPlusConfig.cmake"

          echo "SDRPP_CORE_ROOT=$SDRPP_ROOT" >> $GITHUB_ENV

      # =========================================================================
      # WINDOWS: Use portable SDR++ release + generate minimal CMake config
      # =========================================================================
      - name: Setup SDR++ portable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          set -x

          # Use fixed URL for nightly release to avoid API rate limits
          ASSET_URL="https://github.com/AlexandreRouma/SDRPlusPlus/releases/download/nightly/sdrpp_windows_x64.zip"

          echo "=== Downloading SDR++ from: $ASSET_URL ==="
          curl -L -o sdrpp_windows.zip "$ASSET_URL"

          echo "=== Extracting ==="
          7z x sdrpp_windows.zip -osdrpp_install

          echo "=== Finding extracted directory ==="
          find sdrpp_install -maxdepth 1 -type d
          # First, try to find the actual SDR++ subdirectory (exclude parent sdrpp_install)
          SDRPP_DIR=$(find sdrpp_install -mindepth 1 -maxdepth 1 -type d \( -name "*SDRPlusPlus*" -o -name "*sdrpp*" \) | head -1)

          if [ -z "$SDRPP_DIR" ]; then
            # Fallback: any subdirectory of sdrpp_install that's not the parent itself
            SDRPP_DIR=$(find sdrpp_install -mindepth 1 -maxdepth 1 -type d | head -1)
          fi

          if [ -z "$SDRPP_DIR" ]; then
            echo "ERROR: Could not find extracted SDR++ directory"
            exit 1
          fi

          SDRPP_ROOT=$(pwd)/$SDRPP_DIR
          echo "SDR++ extracted to: $SDRPP_ROOT"
          ls -la "$SDRPP_ROOT"

          echo "=== Creating minimal SDRPlusPlusConfig.cmake ==="
          mkdir -p "$SDRPP_ROOT/lib/cmake/SDRPlusPlus"

          # Debug: list the portable release structure
          echo "=== Portable release structure ==="
          find "$SDRPP_ROOT" -type f -name "*.h" | head -20
          ls -la "$SDRPP_ROOT"

          # Find include directory - portable release has include/ or Include/ at root
          INCLUDE_DIR=""
          if [ -d "$SDRPP_ROOT/include" ]; then
            INCLUDE_DIR="$SDRPP_ROOT/include"
          elif [ -d "$SDRPP_ROOT/Include" ]; then
            INCLUDE_DIR="$SDRPP_ROOT/Include"
          else
            # Fallback: search for any .h files
            INCLUDE_DIR=$(find "$SDRPP_ROOT" -name "*.h" -type f | head -1 | xargs dirname 2>/dev/null || echo "")
          fi
          # Only set INCLUDE_DIR if it actually exists
          if [ -n "$INCLUDE_DIR" ] && [ ! -d "$INCLUDE_DIR" ]; then
            INCLUDE_DIR=""
          fi

          # Find lib directory - portable release has .lib/.dll at root or in lib/
          LIB_DIR=""
          if [ -d "$SDRPP_ROOT/lib" ]; then
            LIB_DIR="$SDRPP_ROOT/lib"
          elif [ -d "$SDRPP_ROOT/bin" ]; then
            LIB_DIR="$SDRPP_ROOT/bin"
          else
            # Fallback: search for .lib or .dll files
            LIB_DIR=$(find "$SDRPP_ROOT" -name "*.lib" -o -name "*.dll" | head -1 | xargs dirname 2>/dev/null || echo "")
          fi
          if [ -z "$LIB_DIR" ]; then
            LIB_DIR="$SDRPP_ROOT"
          fi

          echo "INCLUDE_DIR: $INCLUDE_DIR"
          echo "LIB_DIR: $LIB_DIR"

          # Write CMake config using echo (avoids heredoc/YAML issues)
          CFG="$SDRPP_ROOT/lib/cmake/SDRPlusPlus/SDRPlusPlusConfig.cmake"
          echo '# Minimal SDR++ config for plugin development' > "$CFG"
          echo '# Generated from portable release - no separate libraries, use INTERFACE target' >> "$CFG"
          echo '' >> "$CFG"
          echo 'set(SDRPlusPlus_VERSION "1.0.0")' >> "$CFG"

          if [ -n "$INCLUDE_DIR" ]; then
            # Compute relative path from config location to include dir
            REL_INCLUDE="${CMAKE_CURRENT_LIST_DIR}/../../../include"
            echo "set(SDRPlusPlus_INCLUDE_DIRS \"${REL_INCLUDE}\")" >> "$CFG"
          else
            echo "# No include directory found in portable release" >> "$CFG"
            echo "set(SDRPlusPlus_INCLUDE_DIRS \"\")" >> "$CFG"
          fi
          echo '' >> "$CFG"
          echo '# Create INTERFACE target for SDR++ core (portable release has no separate library)' >> "$CFG"
          echo 'if(NOT TARGET SDRPlusPlus::SDRPlusPlus)' >> "$CFG"
          echo '  add_library(SDRPlusPlus::SDRPlusPlus INTERFACE IMPORTED)' >> "$CFG"
          if [ -n "$INCLUDE_DIR" ]; then
            echo '  set_target_properties(SDRPlusPlus::SDRPlusPlus PROPERTIES' >> "$CFG"
            echo '    INTERFACE_INCLUDE_DIRECTORIES "${SDRPlusPlus_INCLUDE_DIRS}"' >> "$CFG"
            echo '  )' >> "$CFG"
          fi
          echo 'endif()' >> "$CFG"
          echo '' >> "$CFG"
          echo '# ImGui is typically bundled with SDR++ - try to find it' >> "$CFG"
          echo 'find_library(SDRPlusPlus_IMGUI_LIBRARY' >> "$CFG"
          echo '  NAMES imgui' >> "$CFG"
          echo '  PATHS "${CMAKE_CURRENT_LIST_DIR}/../../../" "${CMAKE_CURRENT_LIST_DIR}/../../../lib" "${CMAKE_CURRENT_LIST_DIR}/../../../bin"' >> "$CFG"
          echo '  NO_DEFAULT_PATH' >> "$CFG"
          echo ')' >> "$CFG"
          echo '' >> "$CFG"
          echo 'if(SDRPlusPlus_IMGUI_LIBRARY AND NOT TARGET SDRPlusPlus::ImGui)' >> "$CFG"
          echo '  add_library(SDRPlusPlus::ImGui SHARED IMPORTED)' >> "$CFG"
          echo '  set_target_properties(SDRPlusPlus::ImGui PROPERTIES' >> "$CFG"
          echo '    IMPORTED_LOCATION "${SDRPlusPlus_IMGUI_LIBRARY}"' >> "$CFG"
          echo '  )' >> "$CFG"
          echo 'else()' >> "$CFG"
          echo '  # Create INTERFACE target for ImGui if not found' >> "$CFG"
          echo '  if(NOT TARGET SDRPlusPlus::ImGui)' >> "$CFG"
          echo '    add_library(SDRPlusPlus::ImGui INTERFACE IMPORTED)' >> "$CFG"
          echo '  endif()' >> "$CFG"
          echo 'endif()' >> "$CFG"
          echo '' >> "$CFG"
          echo '# Provide compatibility variables' >> "$CFG"
          echo 'set(SDRPlusPlus_LIBRARIES SDRPlusPlus::SDRPlusPlus)' >> "$CFG"
          echo 'set(SDRPlusPlus_DEFINITIONS "")' >> "$CFG"
          echo '' >> "$CFG"
          echo '# Module install directory' >> "$CFG"
          echo 'set(SDRPlusPlus_PLUGIN_INSTALL_DIR "modules" CACHE PATH "SDR++ plugin install directory")' >> "$CFG"
          echo '' >> "$CFG"
          echo 'message(STATUS "Found SDR++ (portable): ${SDRPlusPlus_VERSION}")' >> "$CFG"
          echo 'message(STATUS "SDR++ include dirs: ${SDRPlusPlus_INCLUDE_DIRS}")' >> "$CFG"

          echo "=== Created SDRPlusPlusConfig.cmake ==="
          cat "$SDRPP_ROOT/lib/cmake/SDRPlusPlus/SDRPlusPlusConfig.cmake"

          echo "SDRPP_CORE_ROOT=$SDRPP_ROOT" >> $GITHUB_ENV

      # =========================================================================
      # Configure and build plugin
      # Linux/macOS: system packages (no toolchain)
      # Windows: vcpkg toolchain for static linking
      # =========================================================================
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDRPP_CORE_ROOT="$SDRPP_CORE_ROOT" \
            -DCMAKE_INSTALL_PREFIX=./install

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDRPP_CORE_ROOT="$SDRPP_CORE_ROOT" \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DProtobuf_ROOT=/opt/homebrew

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDRPP_CORE_ROOT="$SDRPP_CORE_ROOT" \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel 4

      - name: Install
        shell: bash
        run: |
          cmake --install build --prefix ./install

      - name: Verify plugin exists
        shell: bash
        run: |
          ls -la ./install/
          find ./install -name "*meshtastic*" -type f

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p ./artifact
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp ./install/meshtastic.dll ./artifact/
          elif [ "${{ runner.os }}" == "Darwin" ]; then
            cp ./install/libmeshtastic.dylib ./artifact/meshtastic.dylib
          else
            cp ./install/libmeshtastic.so ./artifact/meshtastic.so
          fi
          ls -la ./artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./artifact/
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -laR ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*
          generate_release_notes: true