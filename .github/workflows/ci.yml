name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: meshtastic-linux-x64
            plugin_suffix: ".so"
          - os: macos-latest
            artifact_name: meshtastic-macos-x64
            plugin_suffix: ".dylib"
          - os: windows-latest
            artifact_name: meshtastic-windows-x64
            plugin_suffix: ".dll"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # =========================================================================
      # LINUX: System packages only, no vcpkg
      # =========================================================================
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libprotobuf-dev protobuf-compiler \
            libcryptopp-dev \
            libabsl-dev libfmt-dev libspdlog-dev nlohmann-json3-dev \
            libvolk-dev libliquid-dsp-dev \
            pkg-config git

      # =========================================================================
      # MACOS: System packages only, no vcpkg (fix: absl → abseil)
      # =========================================================================
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja protobuf cryptopp abseil fmt spdlog nlohmann-json volk liquid-dsp pkg-config git

      # =========================================================================
      # WINDOWS: Install vcpkg for plugin deps, use portable SDR++ release
      # =========================================================================
      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          set -x

          echo "=== Installing vcpkg ==="
          if [ -d "C:/vcpkg" ]; then
            echo "vcpkg directory exists, removing..."
            rm -rf C:/vcpkg
          fi
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:/vcpkg
          cd C:/vcpkg
          ./bootstrap-vcpkg.bat

          echo "=== Installing plugin dependencies via vcpkg ==="
          ./vcpkg install \
            protobuf \
            cryptopp \
            abseil \
            fmt \
            spdlog \
            nlohmann-json \
            --triplet x64-windows

          echo "VCPKG_ROOT=C:/vcpkg" >> $GITHUB_ENV

      # =========================================================================
      # Build SDR++ from source (Linux/macOS) - use system packages
      # =========================================================================
      - name: Build SDR++ from source (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          set -x

          echo "=== Cloning SDR++ repository ==="
          git clone --depth 1 --branch master https://github.com/AlexandreRouma/SDRPlusPlus.git sdrpp_src

          echo "=== Building SDR++ (system packages) ==="
          cd sdrpp_src
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/../install
          cmake --build . --config Release --parallel 4
          cmake --install .

          echo "=== SDR++ built and installed to: $(pwd)/../install ==="
          ls -la $(pwd)/../install

          find $(pwd)/../install -name "SDRPlusPlusConfig.cmake" -o -name "SDRPlusPlus*.cmake" | head -5

          echo "SDRPP_CORE_ROOT=$(pwd)/../install" >> $GITHUB_ENV

      - name: Build SDR++ from source (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          set -x

          echo "=== Cloning SDR++ repository ==="
          git clone --depth 1 --branch master https://github.com/AlexandreRouma/SDRPlusPlus.git sdrpp_src

          echo "=== Building SDR++ (system packages) ==="
          cd sdrpp_src
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/../install
          cmake --build . --config Release --parallel 4
          cmake --install .

          echo "=== SDR++ built and installed to: $(pwd)/../install ==="
          ls -la $(pwd)/../install

          find $(pwd)/../install -name "SDRPlusPlusConfig.cmake" -o -name "SDRPlusPlus*.cmake" | head -5

          echo "SDRPP_CORE_ROOT=$(pwd)/../install" >> $GITHUB_ENV

      # =========================================================================
      # WINDOWS: Use portable SDR++ release + generate minimal CMake config
      # =========================================================================
      - name: Setup SDR++ portable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          set -x

          echo "=== Fetching latest SDR++ release info ==="
          RELEASE_JSON=$(curl -s https://api.github.com/repos/AlexandreRouma/SDRPlusPlus/releases/latest)

          echo "=== Finding Windows asset with jq ==="
          ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("sdrpp_windows_x64\\.zip$")) | .browser_download_url' | head -1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Primary pattern failed, trying fallback..."
            ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("windows.*x64.*\\.zip$")) | .browser_download_url' | head -1)
          fi

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "ERROR: No Windows asset found in release"
            echo "$RELEASE_JSON" | jq -r '.assets[].name'
            exit 1
          fi

          echo "=== Downloading SDR++ from: $ASSET_URL ==="
          curl -L -o sdrpp_windows.zip "$ASSET_URL"

          echo "=== Extracting ==="
          7z x sdrpp_windows.zip -osdrpp_install

          echo "=== Finding extracted directory ==="
          find sdrpp_install -maxdepth 1 -type d
          SDRPP_DIR=$(find sdrpp_install -maxdepth 1 -type d -name "*SDRPlusPlus*" -o -name "*sdrpp*" | head -1)

          if [ -z "$SDRPP_DIR" ]; then
            SDRPP_DIR=$(find sdrpp_install -maxdepth 1 -type d | grep -v "^sdrpp_install$" | head -1)
          fi

          if [ -z "$SDRPP_DIR" ]; then
            echo "ERROR: Could not find extracted SDR++ directory"
            exit 1
          fi

          SDRPP_ROOT=$(pwd)/$SDRPP_DIR
          echo "SDR++ extracted to: $SDRPP_ROOT"
          ls -la "$SDRPP_ROOT"

          echo "=== Creating minimal SDRPlusPlusConfig.cmake ==="
          mkdir -p "$SDRPP_ROOT/lib/cmake/SDRPlusPlus"

          # Find include and lib directories
          INCLUDE_DIR=$(find "$SDRPP_ROOT" -name "SDRPlusPlus" -type d | grep -E "include|Include" | head -1)
          if [ -z "$INCLUDE_DIR" ]; then
            INCLUDE_DIR=$(find "$SDRPP_ROOT" -name "*.h" -path "*/include/*" | head -1 | xargs dirname | xargs dirname)
          fi
          if [ -z "$INCLUDE_DIR" ]; then
            INCLUDE_DIR="$SDRPP_ROOT/include"
          fi

          LIB_DIR=$(find "$SDRPP_ROOT" -name "*.lib" -o -name "*.dll" | head -1 | xargs dirname)
          if [ -z "$LIB_DIR" ]; then
            LIB_DIR="$SDRPP_ROOT"
          fi

          echo "INCLUDE_DIR: $INCLUDE_DIR"
          echo "LIB_DIR: $LIB_DIR"

          python3 -c "
import os
config_path = os.path.join('$SDRPP_ROOT', 'lib', 'cmake', 'SDRPlusPlus', 'SDRPlusPlusConfig.cmake')
content = '''# Minimal SDR++ config for plugin development
# Generated from portable release

set(SDRPlusPlus_VERSION \"1.0.0\")
set(SDRPlusPlus_INCLUDE_DIRS \"\${CMAKE_CURRENT_LIST_DIR}/../../../include\")
set(SDRPlusPlus_LIBRARY_DIRS \"\${CMAKE_CURRENT_LIST_DIR}/../../../\")

# Find SDR++ libraries
find_library(SDRPlusPlus_SDRPlusPlus_LIBRARY
  NAMES sdrpp_core SDRPlusPlus
  PATHS \"\${SDRPlusPlus_LIBRARY_DIRS}\"
  NO_DEFAULT_PATH
)

find_library(SDRPlusPlus_IMGUI_LIBRARY
  NAMES imgui
  PATHS \"\${SDRPlusPlus_LIBRARY_DIRS}\"
  NO_DEFAULT_PATH
)

# Create imported targets
if(SDRPlusPlus_SDRPlusPlus_LIBRARY AND NOT TARGET SDRPlusPlus::SDRPlusPlus)
  add_library(SDRPlusPlus::SDRPlusPlus SHARED IMPORTED)
  set_target_properties(SDRPlusPlus::SDRPlusPlus PROPERTIES
    IMPORTED_LOCATION \"\${SDRPlusPlus_SDRPlusPlus_LIBRARY}\"
    INTERFACE_INCLUDE_DIRECTORIES \"\${SDRPlusPlus_INCLUDE_DIRS}\"
  )
endif()

if(SDRPlusPlus_IMGUI_LIBRARY AND NOT TARGET SDRPlusPlus::ImGui)
  add_library(SDRPlusPlus::ImGui SHARED IMPORTED)
  set_target_properties(SDRPlusPlus::ImGui PROPERTIES
    IMPORTED_LOCATION \"\${SDRPlusPlus_IMGUI_LIBRARY}\"
  )
endif()

# Provide compatibility variables
set(SDRPlusPlus_LIBRARIES SDRPlusPlus::SDRPlusPlus)
set(SDRPlusPlus_DEFINITIONS \"\")

# Module install directory
set(SDRPlusPlus_PLUGIN_INSTALL_DIR \"modules\" CACHE PATH \"SDR++ plugin install directory\")

message(STATUS \"Found SDR++ (portable): \${SDRPlusPlus_VERSION}\")
message(STATUS \"SDR++ include dirs: \${SDRPlusPlus_INCLUDE_DIRS}\")
message(STATUS \"SDR++ library dirs: \${SDRPlusPlus_LIBRARY_DIRS}\")
'''
with open(config_path, 'w') as f:
    f.write(content)
print('Created:', config_path)
          "

          echo "=== Created SDRPlusPlusConfig.cmake ==="
          cat "$SDRPP_ROOT/lib/cmake/SDRPlusPlus/SDRPlusPlusConfig.cmake"

          echo "SDRPP_CORE_ROOT=$SDRPP_ROOT" >> $GITHUB_ENV

      # =========================================================================
      # Configure and build plugin
      # Linux/macOS: system packages (no toolchain)
      # Windows: vcpkg toolchain for static linking
      # =========================================================================
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDRPP_CORE_ROOT="$SDRPP_CORE_ROOT" \
            -DCMAKE_INSTALL_PREFIX=./install

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDRPP_CORE_ROOT="$SDRPP_CORE_ROOT" \
            -DCMAKE_INSTALL_PREFIX=./install

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDRPP_CORE_ROOT="$SDRPP_CORE_ROOT" \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel 4

      - name: Install
        shell: bash
        run: |
          cmake --install build --prefix ./install

      - name: Verify plugin exists
        shell: bash
        run: |
          ls -la ./install/
          find ./install -name "*meshtastic*" -type f

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p ./artifact
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp ./install/meshtastic.dll ./artifact/
          elif [ "${{ runner.os }}" == "Darwin" ]; then
            cp ./install/libmeshtastic.dylib ./artifact/meshtastic.dylib
          else
            cp ./install/libmeshtastic.so ./artifact/meshtastic.so
          fi
          ls -la ./artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./artifact/
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -laR ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*
          generate_release_notes: true