name: Build Meshtastic Plugin

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  VCPKG_VERSION: "2024.06.14"
  SDRPP_URL: "https://github.com/AlexandreRouma/SDRPlusPlus/releases/download/nightly/sdrpp_windows_x64.zip"

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            C:/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "C:/vcpkg")) {
            git clone --depth 1 --branch ${{ env.VCPKG_VERSION }} https://github.com/microsoft/vcpkg.git C:/vcpkg
            cd C:/vcpkg; ./bootstrap-vcpkg.bat -disableMetrics
          } else {
            cd C:/vcpkg
            git checkout ${{ env.VCPKG_VERSION }} 2>$null || $true
            ./bootstrap-vcpkg.bat -disableMetrics 2>$null || $true
          }
          $env:VCPKG_BINARY_SOURCES = "clear;files,C:/vcpkg/downloads,readwrite"
          $env:VCPKG_FEATURE_FLAGS = "binarycaching,manifests"
          echo "VCPKG_ROOT=C:/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies (vcpkg manifest mode)
        shell: pwsh
        run: |
          cd C:/vcpkg
          # Use manifest mode to install all dependencies from vcpkg.json
          # This is faster and more reliable with binary caching
          ./vcpkg install --manifest-root ${{ github.workspace }} --triplet x64-windows
          Write-Host "=== Installed packages ==="
          ./vcpkg list --triplet x64-windows
          Write-Host "=== Checking Protobuf config ==="
          $protobufConfig = "C:/vcpkg/installed/x64-windows/share/protobuf/ProtobufConfig.cmake"
          if (Test-Path $protobufConfig) {
            Write-Host "ProtobufConfig.cmake found at $protobufConfig"
          } else {
            Write-Host "ProtobufConfig.cmake NOT found at $protobufConfig"
            if (Test-Path "C:/vcpkg/installed/x64-windows/share") {
              Get-ChildItem "C:/vcpkg/installed/x64-windows/share" | ForEach-Object { Write-Host "  $_" }
            }
          }

      - name: Download SDR++
        id: sdrpp
        shell: pwsh
        run: |
          $url = "${env:SDRPP_URL}"
          $zip = "sdrpp.zip"
          Write-Host "Downloading SDR++ from $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Write-Host "Extracting..."
          Expand-Archive -Path $zip -DestinationPath sdrpp -Force

          # Find the root directory (portable zip extracts to a single folder)
          $dirs = Get-ChildItem sdrpp -Directory
          if ($dirs.Count -eq 1) {
            $root = $dirs[0].FullName
          } else {
            # If multiple directories, look for the one with sdrpp.exe
            $exeDir = Get-ChildItem sdrpp -Recurse -Filter "sdrpp.exe" | Select-Object -First 1
            if ($exeDir) { $root = $exeDir.DirectoryName } else { $root = $dirs[0].FullName }
          }
          Write-Host "SDR++ root: $root"

          # Verify structure
          Write-Host "Checking for include directory..."
          if (Test-Path (Join-Path $root "include")) {
            Write-Host "  Found include at $root/include"
          } else {
            Write-Host "  include not found at root, searching..."
            $inc = Get-ChildItem $root -Recurse -Directory -Filter "include" | Select-Object -First 1
            if ($inc) {
              $root = $inc.Parent.FullName
              Write-Host "  Found include at $root/include"
            } else {
              Write-Host "  WARNING: include directory not found!"
            }
          }

          Write-Host "Checking for lib directory..."
          if (Test-Path (Join-Path $root "lib")) {
            Write-Host "  Found lib at $root/lib"
          } else {
            Write-Host "  WARNING: lib directory not found!"
          }

          # Create cmake config directory
          $cmakeDir = Join-Path $root "lib/cmake/SDRPlusPlus"
          if (-not (Test-Path $cmakeDir)) {
            New-Item -ItemType Directory -Force -Path $cmakeDir | Out-Null
          }
          Write-Host "CMake config dir: $cmakeDir"

          # Use forward slashes to avoid CMake escape sequence issues
          $rootForward = $root.Replace('\', '/')

          # Create SDRPlusPlusConfig.cmake
          $configFile = Join-Path $cmakeDir "SDRPlusPlusConfig.cmake"
          @(
            '# Minimal SDRPlusPlus config for plugin building'
            'set(SDRPlusPlus_VERSION "nightly")'
            'set(SDRPlusPlus_INCLUDE_DIRS "' + $rootForward + '/include")'
            'set(SDRPlusPlus_LIBRARY_DIRS "' + $rootForward + '/lib")'
            'set(SDRPlusPlus_LIBRARIES "")'
            'set(SDRPlusPlus_PLUGIN_SUFFIX ".dll")'
            'set(SDRPlusPlus_PLUGIN_INSTALL_DIR "' + $rootForward + '/plugins")'
          ) | ForEach-Object { $_ | Out-File -FilePath $configFile -Encoding UTF8 }

          # Verify config file was created
          if (Test-Path $configFile) {
            Write-Host "Created SDRPlusPlusConfig.cmake at $configFile"
            Get-Content $configFile | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "ERROR: Failed to create config file!"
          }

          # Create sdrpp_module.cmake (required for plugin building)
          $moduleFile = Join-Path $cmakeDir "sdrpp_module.cmake"
          @(
            '# sdrpp_module.cmake - SDR++ module/plugin build system'
            'cmake_minimum_required(VERSION 3.13)'
            ''
            'function(sdrpp_add_module MODULE_NAME)'
            '  add_library(${MODULE_NAME} MODULE ${ARGN})'
            '  set_target_properties(${MODULE_NAME} PROPERTIES'
            '    PREFIX ""'
            '    SUFFIX "${SDRPlusPlus_PLUGIN_SUFFIX}"'
            '  )'
            '  target_include_directories(${MODULE_NAME} PRIVATE ${SDRPlusPlus_INCLUDE_DIRS})'
            '  target_link_libraries(${MODULE_NAME} PRIVATE ${SDRPlusPlus_LIBRARIES})'
            '  if (SDRPlusPlus_PLUGIN_INSTALL_DIR)'
            '    install(TARGETS ${MODULE_NAME} DESTINATION ${SDRPlusPlus_PLUGIN_INSTALL_DIR})'
            '  endif()'
            'endfunction()'
            ''
            'function(sdrpp_get_module_cmake_dir OUT_VAR)'
            '  set(${OUT_VAR} ${CMAKE_CURRENT_LIST_DIR} PARENT_SCOPE)'
            'endfunction()'
          ) | ForEach-Object { $_ | Out-File -FilePath $moduleFile -Encoding UTF8 }

          if (Test-Path $moduleFile) {
            Write-Host "Created sdrpp_module.cmake at $moduleFile"
          } else {
            Write-Host "ERROR: Failed to create module file!"
          }

          echo "SDRPP_ROOT=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "SDRPP_CMAKE_DIR=$cmakeDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Use CMAKE_PREFIX_PATH to find vcpkg installed packages directly
          # Packages were already installed in "Install dependencies" step to C:/vcpkg/installed/x64-windows
          $cmakeArgs = @(
            '-S', '.'
            '-B', 'build'
            '-G', 'Visual Studio 17 2022'
            '-A', 'x64'
            '-DCMAKE_BUILD_TYPE=Release'
            '-DCMAKE_PREFIX_PATH=C:/vcpkg/installed/x64-windows'
            '-DSDRPP_CORE_ROOT="${{ steps.sdrpp.outputs.SDRPP_ROOT }}"'
            '-DSDRPP_CMAKE_DIR="${{ steps.sdrpp.outputs.SDRPP_CMAKE_DIR }}"'
            '-DSDRPP_MODULE_CMAKE="${{ steps.sdrpp.outputs.SDRPP_CMAKE_DIR }}/sdrpp_module.cmake"'
            '-DSDRPlusPlus_DIR="${{ steps.sdrpp.outputs.SDRPP_CMAKE_DIR }}"'
          )

          Write-Host "Running cmake with arguments:"
          Write-Host ($cmakeArgs -join ' ')

          # GitHub Actions windows-2022 runner has VS build tools in PATH
          # Use PowerShell argument splatting to handle spaces in generator name correctly
          $exitCode = & cmake @cmakeArgs
          if ($exitCode -ne 0) {
            throw "cmake configure failed with exit code $exitCode"
          }
          Write-Host "Configure step completed successfully"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-decoder-plugin
          path: build/Release/*.dll
          retention-days: 7

      - name: Package on tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: cmake --build build --config Release --target package

      - name: Upload package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-decoder-plugin-package
          path: build/*.zip
          retention-days: 7