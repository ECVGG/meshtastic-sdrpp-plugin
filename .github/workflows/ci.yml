name: CI Simple Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_windows:
    name: Build Windows (MSVC, ${{ matrix.build_type }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # -----------------------------------------------------------------------
      # Cache vcpkg installed packages to avoid rebuilding from source
      # -----------------------------------------------------------------------
      - name: Cache vcpkg packages
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            C:/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Test step
        shell: pwsh
        run: Write-Host "Test successful for ${{ matrix.build_type }}"