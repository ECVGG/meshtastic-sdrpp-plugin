name: CI/CD - Windows Only

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  # Build configuration
  BUILD_TYPES: "Release;RelWithDebInfo"
  # SDR++ portable release URL (nightly)
  SDRPP_PORTABLE_URL: "https://github.com/AlexandreRouma/SDRPlusPlus/releases/download/nightly/SDRPlusPlus_win64.zip"

jobs:
  # =========================================================================
  # Windows Build (latest) - MSVC with portable SDR++ and vcpkg caching
  # =========================================================================
  build_windows:
    name: Build Windows (MSVC, ${{ matrix.build_type }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # -----------------------------------------------------------------------
      # Cache vcpkg installed packages to avoid rebuilding from source
      # -----------------------------------------------------------------------
      - name: Cache vcpkg packages
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            C:/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # -----------------------------------------------------------------------
      # Setup vcpkg with binary caching enabled
      # -----------------------------------------------------------------------
      - name: Setup vcpkg (Windows)
        shell: pwsh
        timeout-minutes: 15
        run: |
          # vcpkg is pre-installed on windows-latest at C:/vcpkg
          if (-not (Test-Path "C:/vcpkg")) {
            Write-Host "vcpkg not found, installing..."
            git clone --depth 1 --branch 2024.06.14 https://github.com/microsoft/vcpkg.git C:/vcpkg
            cd C:/vcpkg
            ./bootstrap-vcpkg.bat -disableMetrics
          } else {
            Write-Host "Using pre-installed vcpkg at C:/vcpkg"
            cd C:/vcpkg
            # Ensure we're on a pinned commit with good binary cache
            git fetch --depth 1 origin 2024.06.14 2>$null || $true
            git checkout 2024.06.14 2>$null || $true
            ./bootstrap-vcpkg.bat -disableMetrics 2>$null || $true
          }

          # Enable binary caching via environment variable
          $env:VCPKG_BINARY_SOURCES = "clear;files,${env:RUNNER_TEMP}/vcpkg-binaries,readwrite"
          $env:VCPKG_FEATURE_FLAGS = "manifests,binarycaching"

          # Create binary cache directory
          New-Item -ItemType Directory -Force -Path "${env:RUNNER_TEMP}/vcpkg-binaries" | Out-Null

          Write-Host "VCPKG_BINARY_SOURCES=$env:VCPKG_BINARY_SOURCES"
          Write-Host "VCPKG_FEATURE_FLAGS=$env:VCPKG_FEATURE_FLAGS"

          echo "VCPKG_ROOT=C:/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      # -----------------------------------------------------------------------
      # Install dependencies via vcpkg (uses cache if available)
      # -----------------------------------------------------------------------
      - name: Install vcpkg dependencies
        shell: pwsh
        timeout-minutes: 20
        run: |
          cd C:/vcpkg
          # Install only required packages from manifest
          # This will use binary cache if available, otherwise build from source
          ./vcpkg install --triplet x64-windows `
            --x-manifest-root="${{ github.workspace }}" `
            --x-wait-for-lock `
            --feature-flags=manifests,binarycaching `
            --binarysource="clear;files,${env:RUNNER_TEMP}/vcpkg-binaries,readwrite"

          # Verify installed packages
          ./vcpkg list --triplet x64-windows

      # -----------------------------------------------------------------------
      # Download portable SDR++ nightly release (much faster than building from source)
      # -----------------------------------------------------------------------
      - name: Download portable SDR++ (Windows)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $url = "${env:SDRPP_PORTABLE_URL}"
          $output = "sdrpp_portable.zip"
          Write-Host "Downloading SDR++ portable from: $url"
          try {
            Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing
          } catch {
            Write-Error "Failed to download SDR++ portable: $_"
            exit 1
          }

          # Extract
          Write-Host "Extracting SDR++ portable..."
          Expand-Archive -Path $output -DestinationPath sdrpp_portable -Force

          # Find the extracted directory (usually SDRPlusPlus_win64)
          $sdrppDir = Get-ChildItem -Path sdrpp_portable -Directory | Select-Object -First 1
          if (-not $sdrppDir) {
            Write-Error "Could not find extracted SDR++ directory"
            exit 1
          }

          $sdrppRoot = Join-Path (Get-Location) $sdrppDir.FullName
          Write-Host "SDR++ extracted to: $sdrppRoot"

          # Verify structure
          if (-not (Test-Path (Join-Path $sdrppRoot "include"))) {
            Write-Warning "No include directory found at root, checking subdirectories..."
            $includeDir = Get-ChildItem -Path $sdrppRoot -Recurse -Directory -Filter "include" | Select-Object -First 1
            if ($includeDir) {
              $sdrppRoot = $includeDir.Parent.FullName
              Write-Host "Found include at parent: $sdrppRoot"
            }
          }

          # Find CMake config directory
          $cmakeDir = Get-ChildItem -Path $sdrppRoot -Recurse -Directory -Filter "SDRPlusPlus" | Where-Object { $_.FullName -match "cmake" } | Select-Object -First 1
          if ($cmakeDir) {
            $cmakeConfigDir = $cmakeDir.FullName
          } else {
            $cmakeConfigDir = Join-Path $sdrppRoot "lib/cmake/SDRPlusPlus"
            if (-not (Test-Path $cmakeConfigDir)) {
              New-Item -ItemType Directory -Force -Path $cmakeConfigDir | Out-Null
              # Create minimal SDRPlusPlusConfig.cmake if not present
              @"
# Minimal SDRPlusPlus config for plugin building
set(SDRPlusPlus_VERSION "nightly")
set(SDRPlusPlus_INCLUDE_DIRS "${sdrppRoot}/include")
set(SDRPlusPlus_LIBRARY_DIRS "${sdrppRoot}/lib")
set(SDRPlusPlus_PLUGIN_SUFFIX ".dll")
set(SDRPlusPlus_PLUGIN_INSTALL_DIR "${sdrppRoot}/plugins")

# Find required components
find_package(Protobuf REQUIRED)
find_package(Cryptopp REQUIRED)
find_package(Threads REQUIRED)

# Plugin dependencies
find_package(fmt QUIET)
find_package(spdlog QUIET)
find_package(nlohmann_json QUIET)
"@
              | Out-File -FilePath (Join-Path $cmakeConfigDir "SDRPlusPlusConfig.cmake") -Encoding UTF8
            }
          }

          Write-Host "SDRPP_ROOT=$sdrppRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "SDRPP_CMAKE_DIR=$cmakeConfigDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # -----------------------------------------------------------------------
      # Configure plugin build
      # -----------------------------------------------------------------------
      - name: Configure plugin build
        shell: pwsh
        run: |
          cmake -S . -B build_${{ matrix.build_type }} `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DSDRPP_CORE_ROOT="${{ steps.sdrpp.outputs.SDRPP_ROOT }}" `
            -DSDRPP_CMAKE_DIR="${{ steps.sdrpp.outputs.SDRPP_CMAKE_DIR }}"

      # -----------------------------------------------------------------------
      # Build plugin
      # -----------------------------------------------------------------------
      - name: Build plugin
        shell: pwsh
        timeout-minutes: 20
        run: |
          cmake --build build_${{ matrix.build_type }} --config ${{ matrix.build_type }} --parallel

      # -----------------------------------------------------------------------
      # Run tests (if any)
      # -----------------------------------------------------------------------
      - name: Run tests
        shell: pwsh
        run: |
          cd build_${{ matrix.build_type }}
          ctest --output-on-failure --parallel || $true

      # -----------------------------------------------------------------------
      # Package artifacts (on tag push)
      # -----------------------------------------------------------------------
      - name: Package artifacts
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          cmake --build build_${{ matrix.build_type }} --config ${{ matrix.build_type }} --target package

      # -----------------------------------------------------------------------
      # Upload artifacts
      # -----------------------------------------------------------------------
      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-decoder-windows-${{ matrix.build_type }}
          path: |
            build_${{ matrix.build_type }}/*.dll
            build_${{ matrix.build_type }}/*.zip
            build_${{ matrix.build_type }}/*.exe

      # -----------------------------------------------------------------------
      # Upload build logs on failure
      # -----------------------------------------------------------------------
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows-${{ matrix.build_type }}
          path: |
            build_${{ matrix.build_type }}/CMakeFiles/*.log
            C:/vcpkg/installed/vcpkg/issues/*.json
          retention-days: 7