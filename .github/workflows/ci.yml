name: CI Simple Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_windows:
    name: Build Windows (MSVC, ${{ matrix.build_type }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test step
        shell: pwsh
        run: Write-Host "Test successful for ${{ matrix.build_type }}"