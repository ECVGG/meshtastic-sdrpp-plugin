name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: meshtastic-linux-x64
            plugin_suffix: ".so"
          - os: macos-latest
            artifact_name: meshtastic-macos-x64
            plugin_suffix: ".dylib"
          - os: windows-latest
            artifact_name: meshtastic-windows-x64
            plugin_suffix: ".dll"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # =========================================================================
      # LINUX: System packages only, no vcpkg
      # =========================================================================
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libprotobuf-dev protobuf-compiler \
            libcryptopp-dev \
            libabsl-dev libfmt-dev libspdlog-dev nlohmann-json3-dev \
            libvolk-dev libliquid-dsp-dev \
            pkg-config git

      # =========================================================================
      # MACOS: System packages only, no vcpkg (fix: absl → abseil)
      # =========================================================================
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja protobuf cryptopp abseil fmt spdlog nlohmann-json volk liquid-dsp pkg-config git

      # =========================================================================
      # WINDOWS: Install vcpkg for plugin deps, use portable SDR++ release
      # =========================================================================
      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          set -x

          echo "=== Installing vcpkg ==="
          if [ -d "C:/vcpkg" ]; then
            echo "vcpkg directory exists, removing..."
            rm -rf C:/vcpkg
          fi
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:/vcpkg
          cd C:/vcpkg
          ./bootstrap-vcpkg.bat

          echo "=== Installing plugin dependencies via vcpkg ==="
          ./vcpkg install \
            protobuf \
            cryptopp \
            abseil \
            fmt \
            spdlog \
            nlohmann-json \
            --triplet x64-windows

          echo "VCPKG_ROOT=C:/vcpkg" >> $GITHUB_ENV

      # =========================================================================
      # Build SDR++ from source (Linux/macOS) - use system packages
      # =========================================================================
      - name: Build SDR++ from source (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          set -x

          echo "=== Cloning SDR++ repository ==="
          git clone --depth 1 --branch master https://github.com/AlexandreRouma/SDRPlusPlus.git sdrpp_src

          echo "=== Building SDR++ (system packages) ==="
          cd sdrpp_src
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/../install
          cmake --build . --config Release --parallel 4
          cmake --install .

          echo "=== SDR++ built and installed to: $(pwd)/../install ==="
          ls -la $(pwd)/../install

          find $(pwd)/../install -name "SDRPlusPlusConfig.cmake" -o -name "SDRPlusPlus*.cmake" | head -5

          echo "SDRPP_CORE_ROOT=$(pwd)/../install" >> $GITHUB_ENV

      - name: Build SDR++ from source (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          set -x

          echo "=== Cloning SDR++ repository ==="
          git clone --depth 1 --branch master https://github.com/AlexandreRouma/SDRPlusPlus.git sdrpp_src

          echo "=== Building SDR++ (system packages) ==="
          cd sdrpp_src
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/../install
          cmake --build . --config Release --parallel 4
          cmake --install .

          echo "=== SDR++ built and installed to: $(pwd)/../install ==="
          ls -la $(pwd)/../install

          find $(pwd)/../install -name "SDRPlusPlusConfig.cmake" -o -name "SDRPlusPlus*.cmake" | head -5

          echo "SDRPP_CORE_ROOT=$(pwd)/../install" >> $GITHUB_ENV

      # =========================================================================
      # WINDOWS: Use portable SDR++ release + generate minimal CMake config
      # =========================================================================
      - name: Setup SDR++ portable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          set -x

          # Use fixed URL for nightly release to avoid API rate limits
          ASSET_URL="https://github.com/AlexandreRouma/SDRPlusPlus/releases/download/nightly/sdrpp_windows_x64.zip"

          echo "=== Downloading SDR++ from: $ASSET_URL ==="
          curl -L -o sdrpp_windows.zip "$ASSET_URL"

          echo "=== Extracting ==="
          7z x sdrpp_windows.zip -osdrpp_install

          echo "=== Finding extracted directory ==="
          find sdrpp_install -maxdepth 1 -type d
          # First, try to find the actual SDR++ subdirectory (exclude parent sdrpp_install)
          SDRPP_DIR=$(find sdrpp_install -mindepth 1 -maxdepth 1 -type d \( -name "*SDRPlusPlus*" -o -name "*sdrpp*" \) | head -1)

          if [ -z "$SDRPP_DIR" ]; then
            # Fallback: any subdirectory of sdrpp_install that's not the parent itself
            SDRPP_DIR=$(find sdrpp_install -mindepth 1 -maxdepth 1 -type d | head -1)
          fi

          if [ -z "$SDRPP_DIR" ]; then
            echo "ERROR: Could not find extracted SDR++ directory"
            exit 1
          fi

          SDRPP_ROOT=$(pwd)/$SDRPP_DIR
          echo "SDR++ extracted to: $SDRPP_ROOT"
          ls -la "$SDRPP_ROOT"

          echo "=== Creating minimal SDRPlusPlusConfig.cmake ==="
          mkdir -p "$SDRPP_ROOT/lib/cmake/SDRPlusPlus"

          # Find include directory - portable release has include/ or Include/ at root
          INCLUDE_DIR=""
          if [ -d "$SDRPP_ROOT/include" ]; then
            INCLUDE_DIR="$SDRPP_ROOT/include"
          elif [ -d "$SDRPP_ROOT/Include" ]; then
            INCLUDE_DIR="$SDRPP_ROOT/Include"
          else
            # Fallback: search for any .h files
            INCLUDE_DIR=$(find "$SDRPP_ROOT" -name "*.h" -type f | head -1 | xargs dirname 2>/dev/null || echo "")
          fi
          if [ -z "$INCLUDE_DIR" ]; then
            INCLUDE_DIR="$SDRPP_ROOT/include"
          fi

          # Find lib directory - portable release has .lib/.dll at root or in lib/
          LIB_DIR=""
          if [ -d "$SDRPP_ROOT/lib" ]; then
            LIB_DIR="$SDRPP_ROOT/lib"
          elif [ -d "$SDRPP_ROOT/bin" ]; then
            LIB_DIR="$SDRPP_ROOT/bin"
          else
            # Fallback: search for .lib or .dll files
            LIB_DIR=$(find "$SDRPP_ROOT" -name "*.lib" -o -name "*.dll" | head -1 | xargs dirname 2>/dev/null || echo "")
          fi
          if [ -z "$LIB_DIR" ]; then
            LIB_DIR="$SDRPP_ROOT"
          fi

          echo "INCLUDE_DIR: $INCLUDE_DIR"
          echo "LIB_DIR: $LIB_DIR"

          # Write CMake config using echo (avoids heredoc/YAML issues)
          CFG="$SDRPP_ROOT/lib/cmake/SDRPlusPlus/SDRPlusPlusConfig.cmake"
          echo '# Minimal SDR++ config for plugin development' > "$CFG"
          echo '# Generated from portable release - no separate libraries, use INTERFACE target' >> "$CFG"
          echo '' >> "$CFG"
          echo 'set(SDRPlusPlus_VERSION "1.0.0")' >> "$CFG"
          echo 'set(SDRPlusPlus_INCLUDE_DIRS "${CMAKE_CURRENT_LIST_DIR}/../../../include")' >> "$CFG"
          echo '' >> "$CFG"
          echo '# Create INTERFACE target for SDR++ core (portable release has no separate library)' >> "$CFG"
          echo 'if(NOT TARGET SDRPlusPlus::SDRPlusPlus)' >> "$CFG"
          echo '  add_library(SDRPlusPlus::SDRPlusPlus INTERFACE IMPORTED)' >> "$CFG"
          echo '  set_target_properties(SDRPlusPlus::SDRPlusPlus PROPERTIES' >> "$CFG"
          echo '    INTERFACE_INCLUDE_DIRECTORIES "${SDRPlusPlus_INCLUDE_DIRS}"' >> "$CFG"
          echo '  )' >> "$CFG"
          echo 'endif()' >> "$CFG"
          echo '' >> "$CFG"
          echo '# ImGui is typically bundled with SDR++ - try to find it' >> "$CFG"
          echo 'find_library(SDRPlusPlus_IMGUI_LIBRARY' >> "$CFG"
          echo '  NAMES imgui' >> "$CFG"
          echo '  PATHS "${CMAKE_CURRENT_LIST_DIR}/../../../" "${CMAKE_CURRENT_LIST_DIR}/../../../lib" "${CMAKE_CURRENT_LIST_DIR}/../../../bin"' >> "$CFG"
          echo '  NO_DEFAULT_PATH' >> "$CFG"
          echo ')' >> "$CFG"
          echo '' >> "$CFG"
          echo 'if(SDRPlusPlus_IMGUI_LIBRARY AND NOT TARGET SDRPlusPlus::ImGui)' >> "$CFG"
          echo '  add_library(SDRPlusPlus::ImGui SHARED IMPORTED)' >> "$CFG"
          echo '  set_target_properties(SDRPlusPlus::ImGui PROPERTIES' >> "$CFG"
          echo '    IMPORTED_LOCATION "${SDRPlusPlus_IMGUI_LIBRARY}"' >> "$CFG"
          echo '  )' >> "$CFG"
          echo 'else()' >> "$CFG"
          echo '  # Create INTERFACE target for ImGui if not found' >> "$CFG"
          echo '  if(NOT TARGET SDRPlusPlus::ImGui)' >> "$CFG"
          echo '    add_library(SDRPlusPlus::ImGui INTERFACE IMPORTED)' >> "$CFG"
          echo '  endif()' >> "$CFG"
          echo 'endif()' >> "$CFG"
          echo '' >> "$CFG"
          echo '# Provide compatibility variables' >> "$CFG"
          echo 'set(SDRPlusPlus_LIBRARIES SDRPlusPlus::SDRPlusPlus)' >> "$CFG"
          echo 'set(SDRPlusPlus_DEFINITIONS "")' >> "$CFG"
          echo '' >> "$CFG"
          echo '# Module install directory' >> "$CFG"
          echo 'set(SDRPlusPlus_PLUGIN_INSTALL_DIR "modules" CACHE PATH "SDR++ plugin install directory")' >> "$CFG"
          echo '' >> "$CFG"
          echo 'message(STATUS "Found SDR++ (portable): ${SDRPlusPlus_VERSION}")' >> "$CFG"
          echo 'message(STATUS "SDR++ include dirs: ${SDRPlusPlus_INCLUDE_DIRS}")' >> "$CFG"

          echo "=== Created SDRPlusPlusConfig.cmake ==="
          cat "$SDRPP_ROOT/lib/cmake/SDRPlusPlus/SDRPlusPlusConfig.cmake"

          echo "SDRPP_CORE_ROOT=$SDRPP_ROOT" >> $GITHUB_ENV

      # =========================================================================
      # Configure and build plugin
      # Linux/macOS: system packages (no toolchain)
      # Windows: vcpkg toolchain for static linking
      # =========================================================================
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDRPP_CORE_ROOT="$SDRPP_CORE_ROOT" \
            -DCMAKE_INSTALL_PREFIX=./install

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDRPP_CORE_ROOT="$SDRPP_CORE_ROOT" \
            -DCMAKE_INSTALL_PREFIX=./install

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDRPP_CORE_ROOT="$SDRPP_CORE_ROOT" \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel 4

      - name: Install
        shell: bash
        run: |
          cmake --install build --prefix ./install

      - name: Verify plugin exists
        shell: bash
        run: |
          ls -la ./install/
          find ./install -name "*meshtastic*" -type f

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p ./artifact
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp ./install/meshtastic.dll ./artifact/
          elif [ "${{ runner.os }}" == "Darwin" ]; then
            cp ./install/libmeshtastic.dylib ./artifact/meshtastic.dylib
          else
            cp ./install/libmeshtastic.so ./artifact/meshtastic.so
          fi
          ls -la ./artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./artifact/
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -laR ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*
          generate_release_notes: true