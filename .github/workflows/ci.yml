name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: meshtastic-linux-x64
            plugin_suffix: ".so"
          - os: macos-latest
            artifact_name: meshtastic-macos-x64
            plugin_suffix: ".dylib"
          - os: windows-latest
            artifact_name: meshtastic-windows-x64
            plugin_suffix: ".dll"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # =========================================================================
      # LINUX: System packages only, no vcpkg
      # =========================================================================
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libprotobuf-dev protobuf-compiler \
            libcryptopp-dev \
            libabsl-dev libfmt-dev libspdlog-dev nlohmann-json3-dev \
            libvolk-dev libliquid-dsp-dev \
            pkg-config git

      # =========================================================================
      # MACOS: System packages only, no vcpkg (fix: absl → abseil)
      # =========================================================================
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja protobuf cryptopp abseil fmt spdlog nlohmann-json volk liquid-dsp pkg-config git

      # =========================================================================
      # WINDOWS: Install vcpkg manually, use for static linking
      # =========================================================================
      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          set -x

          echo "=== Installing vcpkg ==="
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:/vcpkg
          cd C:/vcpkg
          ./bootstrap-vcpkg.bat

          echo "=== Installing dependencies via vcpkg ==="
          ./vcpkg install \
            protobuf \
            cryptopp \
            abseil \
            fmt \
            spdlog \
            nlohmann-json \
            glfw3 \
            --triplet x64-windows-static-md

          echo "VCPKG_ROOT=C:/vcpkg" >> $GITHUB_ENV

      # =========================================================================
      # Build SDR++ from source on ALL platforms
      # =========================================================================
      - name: Build SDR++ from source (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          set -x

          echo "=== Cloning SDR++ repository ==="
          git clone --depth 1 --branch master https://github.com/AlexandreRouma/SDRPlusPlus.git sdrpp_src

          echo "=== Building SDR++ (system packages) ==="
          cd sdrpp_src
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/../install
          cmake --build . --config Release --parallel 4
          cmake --install .

          echo "=== SDR++ built and installed to: $(pwd)/../install ==="
          ls -la $(pwd)/../install

          find $(pwd)/../install -name "SDRPlusPlusConfig.cmake" -o -name "SDRPlusPlus*.cmake" | head -5

          echo "SDRPP_CORE_ROOT=$(pwd)/../install" >> $GITHUB_ENV

      - name: Build SDR++ from source (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          set -x

          echo "=== Cloning SDR++ repository ==="
          git clone --depth 1 --branch master https://github.com/AlexandreRouma/SDRPlusPlus.git sdrpp_src

          echo "=== Building SDR++ (system packages) ==="
          cd sdrpp_src
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/../install
          cmake --build . --config Release --parallel 4
          cmake --install .

          echo "=== SDR++ built and installed to: $(pwd)/../install ==="
          ls -la $(pwd)/../install

          find $(pwd)/../install -name "SDRPlusPlusConfig.cmake" -o -name "SDRPlusPlus*.cmake" | head -5

          echo "SDRPP_CORE_ROOT=$(pwd)/../install" >> $GITHUB_ENV

      - name: Build SDR++ from source (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          set -x

          echo "=== Cloning SDR++ repository ==="
          git clone --depth 1 --branch master https://github.com/AlexandreRouma/SDRPlusPlus.git sdrpp_src

          echo "=== Building SDR++ with vcpkg toolchain (static) ==="
          cd sdrpp_src
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/../install \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build . --config Release --parallel 4
          cmake --install .

          echo "=== SDR++ built and installed to: $(pwd)/../install ==="
          ls -la $(pwd)/../install

          find $(pwd)/../install -name "SDRPlusPlusConfig.cmake" -o -name "SDRPlusPlus*.cmake" | head -5

          echo "SDRPP_CORE_ROOT=$(pwd)/../install" >> $GITHUB_ENV

      # =========================================================================
      # Configure and build plugin
      # Linux/macOS: system packages (no toolchain)
      # Windows: vcpkg toolchain for static linking
      # =========================================================================
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDRPP_CORE_ROOT="$SDRPP_CORE_ROOT" \
            -DCMAKE_INSTALL_PREFIX=./install

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDRPP_CORE_ROOT="$SDRPP_CORE_ROOT" \
            -DCMAKE_INSTALL_PREFIX=./install

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDRPP_CORE_ROOT="$SDRPP_CORE_ROOT" \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel 4

      - name: Install
        shell: bash
        run: |
          cmake --install build --prefix ./install

      - name: Verify plugin exists
        shell: bash
        run: |
          ls -la ./install/
          find ./install -name "*meshtastic*" -type f

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p ./artifact
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp ./install/meshtastic.dll ./artifact/
          elif [ "${{ runner.os }}" == "Darwin" ]; then
            cp ./install/libmeshtastic.dylib ./artifact/meshtastic.dylib
          else
            cp ./install/libmeshtastic.so ./artifact/meshtastic.so
          fi
          ls -la ./artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./artifact/
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -laR ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*
          generate_release_notes: true