name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: meshtastic-linux-x64
            plugin_suffix: ".so"
          - os: macos-latest
            artifact_name: meshtastic-macos-x64
            plugin_suffix: ".dylib"
          - os: windows-latest
            artifact_name: meshtastic-windows-x64
            plugin_suffix: ".dll"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: 'C:/vcpkg'
          vcpkgJsonGlob: 'vcpkg.json'
          vcpkgGitCommitId: 'd186940b2f0c4e8e5b4ff804af57d2a26fbfa091'
          runVcpkgInstall: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libprotobuf-dev protobuf-compiler \
            libcryptopp-dev \
            libabsl-dev libfmt-dev libspdlog-dev nlohmann-json3-dev \
            libvolk-dev libliquid-dsp-dev \
            pkg-config git

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja protobuf cryptopp absl fmt spdlog nlohmann-json volk liquid-dsp pkg-config git

      - name: Download SDR++ portable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          set -x

          echo "=== Fetching latest SDR++ release info ==="
          RELEASE_JSON=$(curl -s https://api.github.com/repos/AlexandreRouma/SDRPlusPlus/releases/latest)
          echo "$RELEASE_JSON" | grep "browser_download_url" | head -20

          echo "=== Finding Windows asset with jq (robust) ==="
          # Use jq to parse JSON and find the Windows x64 zip asset
          ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("sdrpp_windows_x64\\.zip$")) | .browser_download_url' | head -1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Primary pattern failed, trying fallback..."
            ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("windows.*x64.*\\.zip$")) | .browser_download_url' | head -1)
          fi

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Fallback failed, trying any .zip with windows..."
            ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("windows.*\\.zip$")) | .browser_download_url' | head -1)
          fi

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "ERROR: No Windows asset found in release"
            echo "$RELEASE_JSON" | jq -r '.assets[].name'
            exit 1
          fi

          echo "=== Downloading SDR++ from: $ASSET_URL ==="
          curl -L -o sdrpp_windows.zip "$ASSET_URL"

          echo "=== Verifying download ==="
          ls -la sdrpp_windows.zip
          file sdrpp_windows.zip

          echo "=== Checking for 7z ==="
          which 7z || which 7za || which 7zr || (echo "7z not found!" && exit 1)

          echo "=== Extracting ==="
          7z x sdrpp_windows.zip -osdrpp_install

          echo "=== Finding extracted directory ==="
          find sdrpp_install -maxdepth 1 -type d
          SDRPP_DIR=$(find sdrpp_install -maxdepth 1 -type d -name "*SDRPlusPlus*" -o -name "*sdrpp*" | head -1)

          if [ -z "$SDRPP_DIR" ]; then
            echo "No SDRPlusPlus* dir found, trying any subdir..."
            SDRPP_DIR=$(find sdrpp_install -maxdepth 1 -type d | grep -v "^sdrpp_install$" | head -1)
          fi

          if [ -z "$SDRPP_DIR" ]; then
            echo "ERROR: Could not find extracted SDR++ directory"
            exit 1
          fi

          echo "SDRPP_CORE_ROOT=$(pwd)/$SDRPP_DIR" >> $GITHUB_ENV
          echo "=== SDR++ extracted to: $(pwd)/$SDRPP_DIR ==="
          ls -la "$(pwd)/$SDRPP_DIR"

          echo "=== Verifying CMake config exists ==="
          find "$(pwd)/$SDRPP_DIR" -name "SDRPlusPlusConfig.cmake" -o -name "SDRPlusPlus*.cmake" | head -5

      - name: Download SDR++ portable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          set -x

          echo "=== Fetching latest SDR++ release info ==="
          RELEASE_JSON=$(curl -s https://api.github.com/repos/AlexandreRouma/SDRPlusPlus/releases/latest)

          echo "=== Finding Linux asset with jq ==="
          # Try .tar.gz first (not .deb, not AppImage)
          ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("linux.*(amd64|x86_64).*\\.tar\\.gz$")) | .browser_download_url' | head -1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Trying any linux .tar.gz..."
            ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("linux.*\\.tar\\.gz$")) | .browser_download_url' | head -1)
          fi

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Trying AppImage fallback..."
            ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test(".*\\.AppImage$")) | .browser_download_url' | head -1)
          fi

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "ERROR: No Linux asset found in release"
            echo "$RELEASE_JSON" | jq -r '.assets[].name'
            exit 1
          fi

          echo "=== Downloading SDR++ from: $ASSET_URL ==="
          curl -L -o sdrpp_linux.tar.gz "$ASSET_URL"
          mkdir -p sdrpp_install
          tar -xzf sdrpp_linux.tar.gz -C sdrpp_install
          SDRPP_DIR=$(find sdrpp_install -maxdepth 1 -type d -name "*SDRPlusPlus*" -o -name "*sdrpp*" | head -1)
          if [ -z "$SDRPP_DIR" ]; then
            SDRPP_DIR=$(find sdrpp_install -maxdepth 1 -type d | grep -v "^sdrpp_install$" | head -1)
          fi
          echo "SDRPP_CORE_ROOT=$(pwd)/$SDRPP_DIR" >> $GITHUB_ENV
          echo "=== SDR++ extracted to: $(pwd)/$SDRPP_DIR ==="
          ls -la "$(pwd)/$SDRPP_DIR"

      - name: Download SDR++ portable (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          set -x

          echo "=== Fetching latest SDR++ release info ==="
          RELEASE_JSON=$(curl -s https://api.github.com/repos/AlexandreRouma/SDRPlusPlus/releases/latest)

          echo "=== Finding macOS asset with jq ==="
          # Try .zip first (not .dmg - harder to automate)
          ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("macos.*(arm|intel|universal).*\\.zip$")) | .browser_download_url' | head -1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Trying any macos .zip..."
            ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("macos.*\\.zip$")) | .browser_download_url' | head -1)
          fi

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Trying dmg fallback..."
            ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test(".*\\.dmg$")) | .browser_download_url' | head -1)
          fi

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "ERROR: No macOS asset found in release"
            echo "$RELEASE_JSON" | jq -r '.assets[].name'
            exit 1
          fi

          echo "=== Downloading SDR++ from: $ASSET_URL ==="
          if [[ "$ASSET_URL" == *.dmg ]]; then
            curl -L -o sdrpp_macos.dmg "$ASSET_URL"
            hdiutil attach sdrpp_macos.dmg -mountpoint /Volumes/SDRPP
            mkdir -p sdrpp_install
            cp -R /Volumes/SDRPP/SDRPlusPlus*.app sdrpp_install/
            hdiutil detach /Volumes/SDRPP
          else
            curl -L -o sdrpp_macos.zip "$ASSET_URL"
            mkdir -p sdrpp_install
            unzip -q sdrpp_macos.zip -d sdrpp_install
          fi

          SDRPP_DIR=$(find sdrpp_install -maxdepth 1 -type d -name "*SDRPlusPlus*" -o -name "*sdrpp*" | head -1)
          echo "SDRPP_CORE_ROOT=$(pwd)/$SDRPP_DIR" >> $GITHUB_ENV
          echo "=== SDR++ extracted to: $(pwd)/$SDRPP_DIR ==="
          ls -la "$(pwd)/$SDRPP_DIR"

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDRPP_CORE_ROOT="$SDRPP_CORE_ROOT" \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel 4

      - name: Install
        shell: bash
        run: |
          cmake --install build --prefix ./install

      - name: Verify plugin exists
        shell: bash
        run: |
          ls -la ./install/
          find ./install -name "*meshtastic*" -type f

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p ./artifact
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp ./install/meshtastic.dll ./artifact/
          elif [ "${{ runner.os }}" == "Darwin" ]; then
            cp ./install/libmeshtastic.dylib ./artifact/meshtastic.dylib
          else
            cp ./install/libmeshtastic.so ./artifact/meshtastic.so
          fi
          ls -la ./artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./artifact/
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -laR ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*
          generate_release_notes: true