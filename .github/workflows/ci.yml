name: Build Meshtastic Plugin

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  VCPKG_VERSION: "2024.06.14"
  SDRPP_URL: "https://github.com/AlexandreRouma/SDRPlusPlus/releases/download/nightly/sdrpp_windows_x64.zip"

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            C:/vcpkg/downloads
            C:/vcpkg/binarycache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "C:/vcpkg")) {
            git clone --depth 1 --branch ${{ env.VCPKG_VERSION }} https://github.com/microsoft/vcpkg.git C:/vcpkg
            cd C:/vcpkg; ./bootstrap-vcpkg.bat -disableMetrics
          } else {
            cd C:/vcpkg
            git checkout ${{ env.VCPKG_VERSION }} 2>$null || $true
            ./bootstrap-vcpkg.bat -disableMetrics 2>$null || $true
          }
          $env:VCPKG_BINARY_SOURCES = "clear;files,C:/vcpkg/binarycache,readwrite"
          $env:VCPKG_FEATURE_FLAGS = "manifests,binarycaching"
          New-Item -ItemType Directory -Force -Path C:/vcpkg/binarycache | Out-Null
          echo "VCPKG_ROOT=C:/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          cd C:/vcpkg
          ./vcpkg install --triplet x64-windows --x-manifest-root="${{ github.workspace }}" --x-wait-for-lock --feature-flags=manifests,binarycaching --binarysource="clear;files,C:/vcpkg/binarycache,readwrite"
          ./vcpkg list --triplet x64-windows

      - name: Download SDR++
        id: sdrpp
        shell: pwsh
        run: |
          $url = "${env:SDRPP_URL}"
          $zip = "sdrpp.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath sdrpp -Force
          $dir = Get-ChildItem sdrpp -Directory | Select-Object -First 1
          $root = $dir.FullName
          if (-not (Test-Path (Join-Path $root "include"))) {
            $inc = Get-ChildItem $root -Recurse -Directory -Filter "include" | Select-Object -First 1
            if ($inc) { $root = $inc.Parent.FullName }
          }
          $cmake = Get-ChildItem $root -Recurse -Directory -Filter "SDRPlusPlus" | Where-Object { $_.FullName -match "cmake" } | Select-Object -First 1
          if ($cmake) { $cmakeDir = $cmake.FullName }
          else {
            $cmakeDir = Join-Path $root "lib/cmake/SDRPlusPlus"
            if (-not (Test-Path $cmakeDir)) {
              New-Item -ItemType Directory -Force -Path $cmakeDir | Out-Null
              @(
                '# Minimal SDRPlusPlus config for plugin building'
                'set(SDRPlusPlus_VERSION "nightly")'
                'set(SDRPlusPlus_INCLUDE_DIRS "' + $root + '/include")'
                'set(SDRPlusPlus_LIBRARY_DIRS "' + $root + '/lib")'
                'set(SDRPlusPlus_PLUGIN_SUFFIX ".dll")'
                'set(SDRPlusPlus_PLUGIN_INSTALL_DIR "' + $root + '/plugins")'
                'find_package(Protobuf REQUIRED)'
                'find_package(Cryptopp REQUIRED)'
                'find_package(Threads REQUIRED)'
                'find_package(fmt QUIET)'
                'find_package(spdlog QUIET)'
                'find_package(nlohmann_json QUIET)'
                'find_package(abseil QUIET)'
              ) | ForEach-Object { $_ | Out-File -FilePath (Join-Path $cmakeDir "SDRPlusPlusConfig.cmake") -Encoding UTF8 -Append }
            }
          }
          echo "SDRPP_ROOT=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "SDRPP_CMAKE_DIR=$cmakeDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure
        shell: pwsh
        run: |
          # Set up Visual Studio environment
          $vsPath = "${env:ProgramFiles}/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvarsall.bat"
          if (-not (Test-Path $vsPath)) {
            $vsPath = "${env:ProgramFiles}/Microsoft Visual Studio/2022/Community/VC/Auxiliary/Build/vcvarsall.bat"
          }
          if (-not (Test-Path $vsPath)) {
            $vsPath = "${env:ProgramFiles}/Microsoft Visual Studio/2022/Professional/VC/Auxiliary/Build/vcvarsall.bat"
          }
          if (-not (Test-Path $vsPath)) {
            # Try vswhere
            $vswhere = "${env:ProgramFiles}/Microsoft Visual Studio/Installer/vswhere.exe"
            if (Test-Path $vswhere) {
              $vsInstallDir = & $vswhere -latest -property installationPath
              if ($vsInstallDir) {
                $vsPath = Join-Path $vsInstallDir "VC/Auxiliary/Build/vcvarsall.bat"
              }
            }
          }
          if (Test-Path $vsPath) {
            Write-Host "Setting up Visual Studio environment from: $vsPath"
            & $vsPath x64
          } else {
            Write-Warning "Could not find vcvarsall.bat, trying without VS environment setup"
          }

          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DSDRPP_CORE_ROOT="${{ steps.sdrpp.outputs.SDRPP_ROOT }}" -DSDRPP_CMAKE_DIR="${{ steps.sdrpp.outputs.SDRPP_CMAKE_DIR }}"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-decoder-plugin
          path: build/Release/*.dll
          retention-days: 7

      - name: Package on tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: cmake --build build --config Release --target package

      - name: Upload package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-decoder-plugin-package
          path: build/*.zip
          retention-days: 7