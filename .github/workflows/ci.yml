name: Build Meshtastic Plugin

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  VCPKG_VERSION: "2024.06.14"
  SDRPP_URL: "https://github.com/AlexandreRouma/SDRPlusPlus/releases/download/nightly/sdrpp_windows_x64.zip"

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            C:/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "C:/vcpkg")) {
            git clone --depth 1 --branch ${{ env.VCPKG_VERSION }} https://github.com/microsoft/vcpkg.git C:/vcpkg
            cd C:/vcpkg; ./bootstrap-vcpkg.bat -disableMetrics
          } else {
            cd C:/vcpkg
            git checkout ${{ env.VCPKG_VERSION }} 2>$null || $true
            ./bootstrap-vcpkg.bat -disableMetrics 2>$null || $true
          }
          $env:VCPKG_BINARY_SOURCES = "clear;files,C:/vcpkg/downloads,readwrite"
          $env:VCPKG_FEATURE_FLAGS = "manifests,binarycaching"
          echo "VCPKG_ROOT=C:/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          cd C:/vcpkg
          # Install packages using manifest mode (reads vcpkg.json)
          # Use binary caching - try to use cached binaries, fall back to building
          ./vcpkg install --triplet x64-windows --x-manifest-root="${{ github.workspace }}"
          ./vcpkg list --triplet x64-windows

      - name: Download SDR++
        id: sdrpp
        shell: pwsh
        run: |
          $url = "${env:SDRPP_URL}"
          $zip = "sdrpp.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath sdrpp -Force
          $dir = Get-ChildItem sdrpp -Directory | Select-Object -First 1
          $root = $dir.FullName
          if (-not (Test-Path (Join-Path $root "include"))) {
            $inc = Get-ChildItem $root -Recurse -Directory -Filter "include" | Select-Object -First 1
            if ($inc) { $root = $inc.Parent.FullName }
          }
          $cmake = Get-ChildItem $root -Recurse -Directory -Filter "SDRPlusPlus" | Where-Object { $_.FullName -match "cmake" } | Select-Object -First 1
          if ($cmake) { $cmakeDir = $cmake.FullName }
          else {
            $cmakeDir = Join-Path $root "lib/cmake/SDRPlusPlus"
            if (-not (Test-Path $cmakeDir)) {
              New-Item -ItemType Directory -Force -Path $cmakeDir | Out-Null
              # Use forward slashes to avoid CMake escape sequence issues
              $rootForward = $root.Replace('\', '/')
              @(
                '# Minimal SDRPlusPlus config for plugin building'
                'set(SDRPlusPlus_VERSION "nightly")'
                'set(SDRPlusPlus_INCLUDE_DIRS "' + $rootForward + '/include")'
                'set(SDRPlusPlus_LIBRARY_DIRS "' + $rootForward + '/lib")'
                'set(SDRPlusPlus_PLUGIN_SUFFIX ".dll")'
                'set(SDRPlusPlus_PLUGIN_INSTALL_DIR "' + $rootForward + '/plugins")'
                'find_package(Protobuf REQUIRED)'
                'find_package(Cryptopp REQUIRED)'
                'find_package(Threads REQUIRED)'
                'find_package(fmt QUIET)'
                'find_package(spdlog QUIET)'
                'find_package(nlohmann_json QUIET)'
                'find_package(abseil QUIET)'
              ) | ForEach-Object { $_ | Out-File -FilePath (Join-Path $cmakeDir "SDRPlusPlusConfig.cmake") -Encoding UTF8 -Append }
            }
          }
          # Create sdrpp_module.cmake if it doesn't exist (required for plugin building)
          $moduleFile = Join-Path $cmakeDir "sdrpp_module.cmake"
          if (-not (Test-Path $moduleFile)) {
            @(
              '# sdrpp_module.cmake - SDR++ module/plugin build system'
              'cmake_minimum_required(VERSION 3.13)'
              ''
              'function(sdrpp_add_module MODULE_NAME)'
              '  add_library(${MODULE_NAME} MODULE ${ARGN})'
              '  set_target_properties(${MODULE_NAME} PROPERTIES'
              '    PREFIX ""'
              '    SUFFIX "${SDRPlusPlus_PLUGIN_SUFFIX}"'
              '  )'
              '  target_include_directories(${MODULE_NAME} PRIVATE ${SDRPlusPlus_INCLUDE_DIRS})'
              '  target_link_libraries(${MODULE_NAME} PRIVATE ${SDRPlusPlus_LIBRARIES})'
              '  if (SDRPlusPlus_PLUGIN_INSTALL_DIR)'
              '    install(TARGETS ${MODULE_NAME} DESTINATION ${SDRPlusPlus_PLUGIN_INSTALL_DIR})'
              '  endif()'
              'endfunction()'
              ''
              'function(sdrpp_get_module_cmake_dir OUT_VAR)'
              '  set(${OUT_VAR} ${CMAKE_CURRENT_LIST_DIR} PARENT_SCOPE)'
              'endfunction()'
            ) | ForEach-Object { $_ | Out-File -FilePath $moduleFile -Encoding UTF8 -Append }
          }
          echo "SDRPP_ROOT=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "SDRPP_CMAKE_DIR=$cmakeDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Set up Visual Studio environment properly - use vsdevcmd or capture vcvarsall env
          $vswhere = "${env:ProgramFiles}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vcvarsPath = $null
          if (Test-Path $vswhere) {
            $vsInstallDir = & $vswhere -latest -property installationPath
            if ($vsInstallDir) {
              $vcvarsPath = Join-Path $vsInstallDir "VC/Auxiliary/Build/vcvarsall.bat"
            }
          }

          # If vswhere didn't work, try common paths
          if (-not $vcvarsPath -or -not (Test-Path $vcvarsPath)) {
            $paths = @(
              "${env:ProgramFiles}/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvarsall.bat",
              "${env:ProgramFiles}/Microsoft Visual Studio/2022/Community/VC/Auxiliary/Build/vcvarsall.bat",
              "${env:ProgramFiles}/Microsoft Visual Studio/2022/Professional/VC/Auxiliary/Build/vcvarsall.bat"
            )
            foreach ($p in $paths) {
              if (Test-Path $p) { $vcvarsPath = $p; break }
            }
          }

          # Use vcpkg toolchain file - disable manifest mode during configure to prevent re-installing packages
          # Packages were already installed in "Install dependencies" step
          $cmakeArgs = @(
            '-S', '.'
            '-B', 'build'
            '-G', 'Visual Studio 17 2022'
            '-A', 'x64'
            '-DCMAKE_BUILD_TYPE=Release'
            '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake'
            '-DVCPKG_INSTALLATION_ROOT=C:/vcpkg'
            '-DVCPKG_TARGET_TRIPLET=x64-windows'
            '-DVCPKG_MANIFEST_MODE=OFF'
            '-DSDRPP_CORE_ROOT="${{ steps.sdrpp.outputs.SDRPP_ROOT }}"'
            '-DSDRPP_CMAKE_DIR="${{ steps.sdrpp.outputs.SDRPP_CMAKE_DIR }}"'
            '-DSDRPP_MODULE_CMAKE="${{ steps.sdrpp.outputs.SDRPP_CMAKE_DIR }}/sdrpp_module.cmake"'
            '-DSDRPlusPlus_DIR="${{ steps.sdrpp.outputs.SDRPP_CMAKE_DIR }}"'
          )

          Write-Host "Running cmake with arguments:"
          Write-Host ($cmakeArgs -join ' ')

          if ($vcvarsPath -and (Test-Path $vcvarsPath)) {
            Write-Host "Setting up Visual Studio environment from: $vcvarsPath"
            # Use cmd to run vcvarsall then cmake, capturing exit code properly
            # Flatten arrays properly for Start-Process -ArgumentList
            $cmdArgs = @('/c', "`"$vcvarsPath`"", 'x64', '&&', 'cmake') + $cmakeArgs
            Write-Host "Running: cmd $($cmdArgs -join ' ')"
            $exitCode = (Start-Process cmd -ArgumentList $cmdArgs -Wait -PassThru -NoNewWindow).ExitCode
            if ($exitCode -ne 0) {
              throw "cmake configure failed with exit code $exitCode"
            }
          } else {
            Write-Warning "Could not find vcvarsall.bat, trying without VS environment setup"
            $exitCode = (Start-Process cmake -ArgumentList $cmakeArgs -Wait -PassThru -NoNewWindow).ExitCode
            if ($exitCode -ne 0) {
              throw "cmake configure failed with exit code $exitCode"
            }
          }
          Write-Host "Configure step completed successfully"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-decoder-plugin
          path: build/Release/*.dll
          retention-days: 7

      - name: Package on tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: cmake --build build --config Release --target package

      - name: Upload package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-decoder-plugin-package
          path: build/*.zip
          retention-days: 7