name: Build Meshtastic Plugin

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  VCPKG_VERSION: "2024.06.14"
  SDRPP_PORTABLE_URL: "https://github.com/AlexandreRouma/SDRPlusPlus/releases/download/nightly/SDRPlusPlus-win64.zip"

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            C:/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "C:/vcpkg")) {
            git clone --depth 1 --branch ${{ env.VCPKG_VERSION }} https://github.com/microsoft/vcpkg.git C:/vcpkg
            cd C:/vcpkg; ./bootstrap-vcpkg.bat -disableMetrics
          } else {
            cd C:/vcpkg
            git checkout ${{ env.VCPKG_VERSION }} 2>$null || $true
            ./bootstrap-vcpkg.bat -disableMetrics 2>$null || $true
          }
          $env:VCPKG_BINARY_SOURCES = "clear;x-gha,readwrite;files,C:/vcpkg/downloads,readwrite"
          $env:VCPKG_FEATURE_FLAGS = "binarycaching,manifests"
          echo "VCPKG_ROOT=C:/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_TOOLCHAIN_PATH=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          cd C:/vcpkg
          $packages = @("protobuf", "cryptopp", "abseil", "fmt", "spdlog", "nlohmann-json", "gtest")
          ./vcpkg install $packages --triplet x64-windows
          Write-Host "=== Installed packages ==="
          ./vcpkg list --triplet x64-windows

          Write-Host "=== Finding ProtobufConfig.cmake ==="
          $protobufConfigs = Get-ChildItem "C:/vcpkg/installed/x64-windows" -Recurse -Filter "ProtobufConfig.cmake" -ErrorAction SilentlyContinue
          if ($protobufConfigs) {
            $protobufDir = $protobufConfigs[0].DirectoryName
            Write-Host "Found ProtobufConfig.cmake at: $protobufDir"
            echo "PROTOBUF_CONFIG_DIR=$protobufDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "WARNING: ProtobufConfig.cmake not found!"
          }

      - name: Download SDR++ portable (for headers and CMake config)
        shell: pwsh
        run: |
          Write-Host "Downloading SDR++ portable..."
          Invoke-WebRequest -Uri "${{ env.SDRPP_PORTABLE_URL }}" -OutFile "C:/sdrpp-portable.zip"
          Write-Host "Extracting SDR++ portable..."
          Expand-Archive -Path "C:/sdrpp-portable.zip" -DestinationPath "C:/sdrpp-portable" -Force

          # Find the extracted directory (it might be named SDRPlusPlus-* or similar)
          $extractedDirs = Get-ChildItem "C:/sdrpp-portable" -Directory
          if ($extractedDirs.Count -eq 1) {
            $sdrppRoot = $extractedDirs[0].FullName
          } else {
            $sdrppRoot = "C:/sdrpp-portable"
          }

          # Verify headers exist
          $includeDir = Join-Path $sdrppRoot "include"
          if (-not (Test-Path (Join-Path $includeDir "dsp/types.h"))) {
            Write-Host "ERROR: dsp/types.h not found in $includeDir"
            Get-ChildItem $includeDir -Recurse -Filter "*.h" | Select-Object -First 20 | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }

          Write-Host "SDR++ portable headers found at: $includeDir"
          echo "SDRPP_INCLUDE_DIR=$($includeDir.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "SDRPP_ROOT=$($sdrppRoot.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create SDR++ CMake config from portable
        id: sdrpp-config
        shell: pwsh
        run: |
          $includeDir = $env:SDRPP_INCLUDE_DIR
          $sdrppRoot = $env:SDRPP_ROOT

          $cmakeDir = "C:/sdrpp-cmake/SDRPlusPlus"
          if (-not (Test-Path $cmakeDir)) {
            New-Item -ItemType Directory -Force -Path $cmakeDir | Out-Null
          }

          $configFile = Join-Path $cmakeDir "SDRPlusPlusConfig.cmake"
          @(
            '# Minimal SDRPlusPlus config for plugin building (using portable headers)'
            'set(SDRPlusPlus_VERSION "nightly")'
            'set(SDRPlusPlus_INCLUDE_DIRS "' + $includeDir + '")'
            'set(SDRPlusPlus_LIBRARY_DIRS "")'
            'set(SDRPlusPlus_LIBRARIES "")'
            'set(SDRPlusPlus_PLUGIN_SUFFIX ".dll")'
            'set(SDRPlusPlus_PLUGIN_INSTALL_DIR "' + $sdrppRoot + '/plugins")'
          ) | ForEach-Object { $_ | Out-File -FilePath $configFile -Encoding UTF8 }

          Write-Host "Created SDRPlusPlusConfig.cmake at $configFile"
          Get-Content $configFile | ForEach-Object { Write-Host "  $_" }

          $moduleFile = Join-Path $cmakeDir "sdrpp_module.cmake"
          @(
            '# sdrpp_module.cmake - SDR++ module/plugin build system'
            'cmake_minimum_required(VERSION 3.13)'
            ''
            'function(sdrpp_add_module MODULE_NAME)'
            '  add_library(${MODULE_NAME} MODULE ${ARGN})'
            '  set_target_properties(${MODULE_NAME} PROPERTIES'
            '    PREFIX ""'
            '    SUFFIX "${SDRPlusPlus_PLUGIN_SUFFIX}"'
            '  )'
            '  target_include_directories(${MODULE_NAME} PRIVATE ${SDRPlusPlus_INCLUDE_DIRS})'
            '  target_link_libraries(${MODULE_NAME} PRIVATE ${SDRPlusPlus_LIBRARIES})'
            '  if (SDRPlusPlus_PLUGIN_INSTALL_DIR)'
            '    install(TARGETS ${MODULE_NAME} DESTINATION ${SDRPlusPlus_PLUGIN_INSTALL_DIR})'
            '  endif()'
            'endfunction()'
            ''
            'function(sdrpp_get_module_cmake_dir OUT_VAR)'
            '  set(${OUT_VAR} ${CMAKE_CURRENT_LIST_DIR} PARENT_SCOPE)'
            'endfunction()'
          ) | ForEach-Object { $_ | Out-File -FilePath $moduleFile -Encoding UTF8 }

          Write-Host "Created sdrpp_module.cmake at $moduleFile"

          echo "SDRPP_CMAKE_DIR=$cmakeDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $protobufDir = $env:PROTOBUF_CONFIG_DIR

          $cmakeArgs = @(
            '-S', '.'
            '-B', 'build'
            '-G', 'Visual Studio 17 2022'
            '-A', 'x64'
            '-DCMAKE_BUILD_TYPE=Release'
            '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake'
            '-DVCPKG_TARGET_TRIPLET=x64-windows'
            '-DSDRPP_CMAKE_DIR="${{ steps.sdrpp-config.outputs.SDRPP_CMAKE_DIR }}"'
            '-DSDRPP_MODULE_CMAKE="${{ steps.sdrpp-config.outputs.SDRPP_CMAKE_DIR }}/sdrpp_module.cmake"'
            '-DSDRPlusPlus_DIR="${{ steps.sdrpp-config.outputs.SDRPP_CMAKE_DIR }}"'
          )

          if ($protobufDir) {
            $cmakeArgs += "-DCMAKE_PREFIX_PATH=$protobufDir"
          }

          Write-Host "Running cmake with arguments:"
          Write-Host ($cmakeArgs -join ' ')

          $exitCode = & cmake @cmakeArgs
          if ($exitCode -ne 0) {
            throw "cmake configure failed with exit code $exitCode"
          }
          Write-Host "Configure step completed successfully"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-decoder-plugin
          path: build/Release/*.dll
          retention-days: 7

      - name: Package on tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: cmake --build build --config Release --target package

      - name: Upload package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-decoder-plugin-package
          path: build/*.zip
          retention-days: 7