name: Build Meshtastic Plugin

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  VCPKG_VERSION: "2024.06.14"
  SDRPP_REPO: "https://github.com/AlexandreRouma/SDRPlusPlus.git"
  SDRPP_COMMIT: "master"

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            C:/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_VERSION }}-
            vcpkg-${{ runner.os }}-

      - name: Cache SDR++ build
        id: sdrpp-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/sdrpp-build
          key: sdrpp-${{ runner.os }}-${{ env.SDRPP_COMMIT }}
          restore-keys: |
            sdrpp-${{ runner.os }}-

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "C:/vcpkg")) {
            git clone --depth 1 --branch ${{ env.VCPKG_VERSION }} https://github.com/microsoft/vcpkg.git C:/vcpkg
            cd C:/vcpkg; ./bootstrap-vcpkg.bat -disableMetrics
          } else {
            cd C:/vcpkg
            git checkout ${{ env.VCPKG_VERSION }} 2>$null || $true
            ./bootstrap-vcpkg.bat -disableMetrics 2>$null || $true
          }
          # Use remote binary cache (x-gha) + local downloads for fastest installs
          $env:VCPKG_BINARY_SOURCES = "clear;x-gha,readwrite;files,C:/vcpkg/downloads,readwrite"
          $env:VCPKG_FEATURE_FLAGS = "binarycaching,manifests"
          echo "VCPKG_ROOT=C:/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_TOOLCHAIN_PATH=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          cd C:/vcpkg
          $packages = @("protobuf", "cryptopp", "abseil", "fmt", "spdlog", "nlohmann-json", "gtest")
          ./vcpkg install $packages --triplet x64-windows
          Write-Host "=== Installed packages ==="
          ./vcpkg list --triplet x64-windows

          # Find ProtobufConfig.cmake location
          Write-Host "=== Finding ProtobufConfig.cmake ==="
          $protobufConfigs = Get-ChildItem "C:/vcpkg/installed/x64-windows" -Recurse -Filter "ProtobufConfig.cmake" -ErrorAction SilentlyContinue
          if ($protobufConfigs) {
            $protobufDir = $protobufConfigs[0].DirectoryName
            Write-Host "Found ProtobufConfig.cmake at: $protobufDir"
            echo "PROTOBUF_CONFIG_DIR=$protobufDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "WARNING: ProtobufConfig.cmake not found!"
          }

      - name: Build SDR++ from source
        if: steps.sdrpp-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Clone SDR++ (shallow)
          if (-not (Test-Path "C:/sdrpp-src")) {
            git clone --depth 1 --branch ${{ env.SDRPP_COMMIT }} ${{ env.SDRPP_REPO }} C:/sdrpp-src
          } else {
            cd C:/sdrpp-src
            git fetch --depth 1 origin ${{ env.SDRPP_COMMIT }}
            git checkout FETCH_HEAD
          }

          # Configure and build SDR++ (only core, no plugins)
          cmake -S C:/sdrpp-src -B C:/sdrpp-build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DSDRPP_BUILD_PLUGINS=OFF `
            -DSDRPP_BUILD_SDRPP=ON

          cmake --build C:/sdrpp-build --config Release --parallel

          # Verify SDRPlusPlusConfig.cmake was generated
          $configPath = "C:/sdrpp-build/lib/cmake/SDRPlusPlus/SDRPlusPlusConfig.cmake"
          if (Test-Path $configPath) {
            Write-Host "SDRPlusPlusConfig.cmake found at $configPath"
          } else {
            # Search for it
            $configs = Get-ChildItem "C:/sdrpp-build" -Recurse -Filter "SDRPlusPlusConfig.cmake" -ErrorAction SilentlyContinue
            if ($configs) {
              Write-Host "Found at: $($configs[0].FullName)"
            } else {
              Write-Host "ERROR: SDRPlusPlusConfig.cmake not generated!"
              exit 1
            }
          }

      - name: Set SDR++ paths
        id: sdrpp-paths
        shell: pwsh
        run: |
          # Find SDRPlusPlusConfig.cmake
          $configs = Get-ChildItem "C:/sdrpp-build" -Recurse -Filter "SDRPlusPlusConfig.cmake" -ErrorAction SilentlyContinue
          if (-not $configs) {
            Write-Host "ERROR: SDRPlusPlusConfig.cmake not found in build directory!"
            exit 1
          }
          $cmakeDir = $configs[0].DirectoryName
          $root = $cmakeDir.Parent.Parent.Parent.Parent  # Go up to build root

          Write-Host "SDR++ build root: $root"
          Write-Host "SDR++ CMake config dir: $cmakeDir"

          # Verify sdrpp_module.cmake exists
          $moduleFile = Join-Path $cmakeDir "sdrpp_module.cmake"
          if (-not (Test-Path $moduleFile)) {
            Write-Host "Creating sdrpp_module.cmake at $moduleFile"
            @(
              '# sdrpp_module.cmake - SDR++ module/plugin build system'
              'cmake_minimum_required(VERSION 3.13)'
              ''
              'function(sdrpp_add_module MODULE_NAME)'
              '  add_library(${MODULE_NAME} MODULE ${ARGN})'
              '  set_target_properties(${MODULE_NAME} PROPERTIES'
              '    PREFIX ""'
              '    SUFFIX "${SDRPlusPlus_PLUGIN_SUFFIX}"'
              '  )'
              '  target_include_directories(${MODULE_NAME} PRIVATE ${SDRPlusPlus_INCLUDE_DIRS})'
              '  target_link_libraries(${MODULE_NAME} PRIVATE ${SDRPlusPlus_LIBRARIES})'
              '  if (SDRPlusPlus_PLUGIN_INSTALL_DIR)'
              '    install(TARGETS ${MODULE_NAME} DESTINATION ${SDRPlusPlus_PLUGIN_INSTALL_DIR})'
              '  endif()'
              'endfunction()'
              ''
              'function(sdrpp_get_module_cmake_dir OUT_VAR)'
              '  set(${OUT_VAR} ${CMAKE_CURRENT_LIST_DIR} PARENT_SCOPE)'
              'endfunction()'
            ) | ForEach-Object { $_ | Out-File -FilePath $moduleFile -Encoding UTF8 }
          }

          echo "SDRPP_ROOT=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "SDRPP_CMAKE_DIR=$cmakeDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Get protobuf config dir from env
          $protobufDir = $env:PROTOBUF_CONFIG_DIR

          $cmakeArgs = @(
            '-S', '.'
            '-B', 'build'
            '-G', 'Visual Studio 17 2022'
            '-A', 'x64'
            '-DCMAKE_BUILD_TYPE=Release'
            '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake'
            '-DVCPKG_TARGET_TRIPLET=x64-windows'
            '-DSDRPP_CORE_ROOT="${{ steps.sdrpp-paths.outputs.SDRPP_ROOT }}"'
            '-DSDRPP_CMAKE_DIR="${{ steps.sdrpp-paths.outputs.SDRPP_CMAKE_DIR }}"'
            '-DSDRPP_MODULE_CMAKE="${{ steps.sdrpp-paths.outputs.SDRPP_CMAKE_DIR }}/sdrpp_module.cmake"'
            '-DSDRPlusPlus_DIR="${{ steps.sdrpp-paths.outputs.SDRPP_CMAKE_DIR }}"'
          )

          # Add protobuf config dir if found
          if ($protobufDir) {
            $cmakeArgs += "-DCMAKE_PREFIX_PATH=$protobufDir"
          }

          Write-Host "Running cmake with arguments:"
          Write-Host ($cmakeArgs -join ' ')

          $exitCode = & cmake @cmakeArgs
          if ($exitCode -ne 0) {
            throw "cmake configure failed with exit code $exitCode"
          }
          Write-Host "Configure step completed successfully"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-decoder-plugin
          path: build/Release/*.dll
          retention-days: 7

      - name: Package on tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: cmake --build build --config Release --target package

      - name: Upload package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-decoder-plugin-package
          path: build/*.zip
          retention-days: 7