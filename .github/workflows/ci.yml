name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: meshtastic-linux-x64
            plugin_suffix: ".so"
          - os: macos-latest
            artifact_name: meshtastic-macos-x64
            plugin_suffix: ".dylib"
          - os: windows-latest
            artifact_name: meshtastic-windows-x64
            plugin_suffix: ".dll"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: 'C:/vcpkg'
          vcpkgJsonGlob: 'vcpkg.json'
          vcpkgGitCommitId: 'd186940b2f0c4e8e5b4ff804af57d2a26fbfa091'
          runVcpkgInstall: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libprotobuf-dev protobuf-compiler \
            libcryptopp-dev \
            libabsl-dev libfmt-dev libspdlog-dev nlohmann-json3-dev \
            libvolk-dev libliquid-dsp-dev \
            pkg-config git

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja protobuf cryptopp absl fmt spdlog nlohmann-json volk liquid-dsp pkg-config git

      - name: Download SDR++ portable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          set -x

          echo "=== Fetching latest SDR++ release info ==="
          RELEASE_JSON=$(curl -s https://api.github.com/repos/AlexandreRouma/SDRPlusPlus/releases/latest)
          echo "$RELEASE_JSON" | grep "browser_download_url" | head -20

          echo "=== Trying to find Windows asset ==="
          # Try multiple patterns for Windows asset
          ASSET_URL=$(echo "$RELEASE_JSON" | grep "browser_download_url" | grep -i "portable" | grep -i "win" | head -1 | cut -d '"' -f 4)

          if [ -z "$ASSET_URL" ]; then
            echo "Pattern 'portable+win' failed, trying 'win64'..."
            ASSET_URL=$(echo "$RELEASE_JSON" | grep "browser_download_url" | grep -i "win64" | head -1 | cut -d '"' -f 4)
          fi

          if [ -z "$ASSET_URL" ]; then
            echo "Pattern 'win64' failed, trying 'windows'..."
            ASSET_URL=$(echo "$RELEASE_JSON" | grep "browser_download_url" | grep -i "windows" | head -1 | cut -d '"' -f 4)
          fi

          if [ -z "$ASSET_URL" ]; then
            echo "Pattern 'windows' failed, trying any .zip..."
            ASSET_URL=$(echo "$RELEASE_JSON" | grep "browser_download_url" | grep "\.zip" | head -1 | cut -d '"' -f 4)
          fi

          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: No Windows asset found in release"
            echo "$RELEASE_JSON" | grep "browser_download_url"
            exit 1
          fi

          echo "=== Downloading SDR++ from: $ASSET_URL ==="
          curl -L -o sdrpp_portable.zip "$ASSET_URL"

          echo "=== Verifying download ==="
          ls -la sdrpp_portable.zip
          file sdrpp_portable.zip

          echo "=== Checking for 7z ==="
          which 7z || which 7za || which 7zr || (echo "7z not found!" && exit 1)

          echo "=== Extracting ==="
          7z x sdrpp_portable.zip -osdrpp_install

          echo "=== Finding extracted directory ==="
          find sdrpp_install -maxdepth 1 -type d
          SDRPP_DIR=$(find sdrpp_install -maxdepth 1 -type d -name "SDRPlusPlus*" | head -1)

          if [ -z "$SDRPP_DIR" ]; then
            echo "No SDRPlusPlus* dir found, trying any subdir..."
            SDRPP_DIR=$(find sdrpp_install -maxdepth 1 -type d | grep -v "^sdrpp_install$" | head -1)
          fi

          if [ -z "$SDRPP_DIR" ]; then
            echo "ERROR: Could not find extracted SDR++ directory"
            exit 1
          fi

          echo "SDRPP_CORE_ROOT=$(pwd)/$SDRPP_DIR" >> $GITHUB_ENV
          echo "=== SDR++ extracted to: $(pwd)/$SDRPP_DIR ==="
          ls -la "$(pwd)/$SDRPP_DIR"

          echo "=== Verifying CMake config exists ==="
          find "$(pwd)/$SDRPP_DIR" -name "SDRPlusPlusConfig.cmake" -o -name "SDRPlusPlus*.cmake" | head -5

      - name: Download SDR++ portable (Linux)
        if: runner.os == 'Linux'
        run: |
          # Get latest release asset URL for Linux (AppImage or tar.gz)
          ASSET_URL=$(curl -s https://api.github.com/repos/AlexandreRouma/SDRPlusPlus/releases/latest \
            | grep "browser_download_url" \
            | grep -i "linux" \
            | grep -v "AppImage" \
            | head -1 \
            | cut -d '"' -f 4)
          if [ -z "$ASSET_URL" ]; then
            # Fallback to AppImage
            ASSET_URL=$(curl -s https://api.github.com/repos/AlexandreRouma/SDRPlusPlus/releases/latest \
              | grep "browser_download_url" \
              | grep -i "appimage" \
              | head -1 \
              | cut -d '"' -f 4)
          fi
          echo "Downloading SDR++ from: $ASSET_URL"
          curl -L -o sdrpp_linux.tar.gz "$ASSET_URL"
          mkdir -p sdrpp_install
          tar -xzf sdrpp_linux.tar.gz -C sdrpp_install
          SDRPP_DIR=$(find sdrpp_install -maxdepth 1 -type d -name "SDRPlusPlus*" | head -1)
          if [ -z "$SDRPP_DIR" ]; then
            SDRPP_DIR=$(find sdrpp_install -maxdepth 1 -type d | grep -v "^sdrpp_install$" | head -1)
          fi
          echo "SDRPP_CORE_ROOT=$(pwd)/$SDRPP_DIR" >> $GITHUB_ENV
          echo "SDR++ extracted to: $(pwd)/$SDRPP_DIR"
          ls -la "$(pwd)/$SDRPP_DIR"

      - name: Download SDR++ portable (macOS)
        if: runner.os == 'macOS'
        run: |
          # Get latest release asset URL for macOS
          ASSET_URL=$(curl -s https://api.github.com/repos/AlexandreRouma/SDRPlusPlus/releases/latest \
            | grep "browser_download_url" \
            | grep -i "macos\|darwin\|osx" \
            | head -1 \
            | cut -d '"' -f 4)
          echo "Downloading SDR++ from: $ASSET_URL"
          curl -L -o sdrpp_macos.dmg "$ASSET_URL"
          # DMG mounting on GitHub Actions macOS
          hdiutil attach sdrpp_macos.dmg -mountpoint /Volumes/SDRPP
          # Copy to local folder
          cp -R /Volumes/SDRPP/SDRPlusPlus*.app sdrpp_install/
          hdiutil detach /Volumes/SDRPP
          SDRPP_DIR=$(find sdrpp_install -maxdepth 1 -type d -name "SDRPlusPlus*" | head -1)
          # For macOS app bundle, CMake config is in Contents/Frameworks or similar
          echo "SDRPP_CORE_ROOT=$(pwd)/$SDRPP_DIR" >> $GITHUB_ENV
          echo "SDR++ extracted to: $(pwd)/$SDRPP_DIR"
          ls -la "$(pwd)/$SDRPP_DIR"

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDRPP_CORE_ROOT=$SDRPP_CORE_ROOT \
            -DCMAKE_INSTALL_PREFIX=./install

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel 4

      - name: Install
        shell: bash
        run: |
          cmake --install build --prefix ./install

      - name: Verify plugin exists
        shell: bash
        run: |
          ls -la ./install/
          find ./install -name "*meshtastic*" -type f

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p ./artifact
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp ./install/meshtastic.dll ./artifact/
          elif [ "${{ runner.os }}" == "Darwin" ]; then
            cp ./install/libmeshtastic.dylib ./artifact/meshtastic.dylib
          else
            cp ./install/libmeshtastic.so ./artifact/meshtastic.so
          fi
          ls -la ./artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./artifact/
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -laR ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*
          generate_release_notes: true